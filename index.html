<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Divine Rays Tech Hub — Support</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg?v=9.9.28-up" />
  <script src="https://cdn.jsdelivr.net/gh/Lizer-WebCoder/divine-rays-tech-hub@9a17dcda7cbe5a9ad3f9af120b4135532b149a13/js/admin-portal-lock.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/Lizer-WebCoder/divine-rays-tech-hub@545afd29cbaede602653f78631d8c97ce7558683/js/sidebar-profile-layout.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/Lizer-WebCoder/divine-rays-tech-hub@bef23962c979e19d937950b628f10649f3f10b2f/js/theme.js"></script>
  <style>
    html,body{margin:0;min-height:100vh;font-family:Inter,system-ui,sans-serif;background:#0c0c14;color:#eeeef6}
    #boot{display:flex;align-items:center;justify-content:center;min-height:100vh;flex-direction:column;gap:1rem;text-align:center;padding:1.5rem}
    #boot .boot-title{font-size:1.25rem;font-weight:650;margin:0}
    #boot .boot-sub{font-size:.85rem;color:#9494ae;margin:0}
    #boot .boot-dot{width:8px;height:8px;border-radius:50%;background:#a78bfa;display:inline-block;margin:0 3px;animation:bootDot 1.2s ease-in-out infinite}
    #boot .boot-dot:nth-child(2){animation-delay:.15s}
    #boot .boot-dot:nth-child(3){animation-delay:.3s}
    @keyframes bootDot{0%,80%,100%{opacity:.35}40%{opacity:1}}
  </style>
</head>
<body>
  <div id="boot">
    <h1 class="boot-title">Divine Rays Tech Hub</h1>
    <p class="boot-sub">Loading…</p>
    <div><span class="boot-dot"></span><span class="boot-dot"></span><span class="boot-dot"></span></div>
    <p id="boot-hint" style="font-size:.8rem;color:#6b6b80"></p>
  </div>
  <script>
  (async function () {
    var SHELL_SHA = 'abdc47355c0342744e79b8545458cd7d729f93d1';
    var ADMIN_LOCK_SHA = '9a17dcda7cbe5a9ad3f9af120b4135532b149a13';
    var SIDEBAR_PROFILE_SHA = '545afd29cbaede602653f78631d8c97ce7558683';
    var CDN = 'https://cdn.jsdelivr.net/gh/Lizer-WebCoder/divine-rays-tech-hub@';
    var BUST = String(Date.now());
    function withBust(u) { return u + (u.indexOf('?') === -1 ? '?' : '&') + 'b=' + BUST; }
    var hint = document.getElementById('boot-hint');
    try {
      var html = null;
      var urls = [
        'https://raw.githubusercontent.com/Lizer-WebCoder/divine-rays-tech-hub/' + SHELL_SHA + '/index.html',
        CDN + SHELL_SHA + '/index.html'
      ];
      for (var i = 0; i < urls.length; i++) {
        try {
          var r = await fetch(withBust(urls[i]), { cache: 'no-store', credentials: 'omit' });
          if (r.ok) {
            var text = await r.text();
            if (text && text.indexOf('login-screen') !== -1) { html = text; break; }
          }
        } catch (e) {}
      }
      if (!html) throw new Error('Could not load app');
      html = html.replace(/@main\/js\/admin-portal-lock\.js/g, '@' + ADMIN_LOCK_SHA + '/js/admin-portal-lock.js');
      if (html.indexOf('sidebar-profile-layout.js') === -1) {
        html = html.replace('</head>',
          '<script src="' + withBust(CDN + ADMIN_LOCK_SHA + '/js/admin-portal-lock.js') + '"><\/script>' +
          '<script src="' + withBust(CDN + SIDEBAR_PROFILE_SHA + '/js/sidebar-profile-layout.js') + '"><\/script></head>');
      }
      document.open();
      document.write(html);
      document.close();
    } catch (err) {
      if (hint) hint.textContent = String(err && err.message || err);
      document.getElementById('boot').innerHTML =
        '<p style="color:#fca5a5">Could not load app.</p>' +
        '<button onclick="location.reload()" style="margin-top:12px;padding:8px 16px;cursor:pointer">Retry</button>';
    }
  })();
  </script>
</body>
</html>
