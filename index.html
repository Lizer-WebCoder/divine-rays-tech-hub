<!DOCTYPE html>
<html lang="en" data-ecg="on" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <title>Divine Rays Tech Hub — Support</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg?v=943" />
  <script>
    window.__DR_ECG_OK = true;
    try {
      document.documentElement.setAttribute('data-ecg', 'on');
      document.documentElement.setAttribute('data-theme', 'dark');
      localStorage.setItem('dr_theme', 'dark');
    } catch (e) {}
  </script>
  <style>
    html,body{margin:0;min-height:100vh;background:#0c0c14;color:#eeeef6;font-family:Inter,system-ui,sans-serif}
    #boot{display:flex;align-items:center;justify-content:center;min-height:100vh}
    #btn-theme,button#btn-theme,[data-theme-toggle],#theme-toggle{display:none!important}
    #dr-lifeline .dr-ecg-glow{stroke-width:4px!important;opacity:.7!important}
    #dr-lifeline .dr-ecg-core{stroke-width:2.5px!important}
  </style>
</head>
<body>
  <div id="boot">Loading…</div>
  <script>
  (async function () {
    var PIN = '830dac02096eb08be1b2dc22bdc191a14df91a04';
    var CDN = 'https://cdn.jsdelivr.net/gh/Lizer-WebCoder/divine-rays-tech-hub@';
    var B = Date.now();

    function inject(src, defer) {
      var s = document.createElement('script');
      s.src = src;
      if (defer) s.defer = true;
      else s.async = true;
      document.body.appendChild(s);
      return s;
    }

    function loadSync(src) {
      return new Promise(function (res) {
        var s = document.createElement('script');
        s.src = src;
        s.async = false;
        s.onload = function () { res(); };
        s.onerror = function () { res(); };
        document.body.appendChild(s);
      });
    }

    try {
      var r = await fetch(CDN + PIN + '/index.html?b=' + B, { cache: 'no-store', credentials: 'omit' });
      if (!r.ok) r = await fetch('https://raw.githubusercontent.com/Lizer-WebCoder/divine-rays-tech-hub/' + PIN + '/index.html?b=' + B, { cache: 'no-store' });
      if (!r.ok) throw new Error('shell fetch failed');
      var html = await r.text();

      html = html
        .replace(/>Customer</g, '>Employee<')
        .replace(/>Tech Support</g, '>Admin<')
        .replace(/Create Customer Account/g, 'Create End-User Account')
        .replace(/Sign In as Agent/g, 'Sign In')
        .replace(/Create agent account/g, 'Create Admin account')
        .replace(/Lizzz?\s*[·•\-]\s*All Rights Reserved/gi, 'Boys at the Back LRK · All Rights Reserved');

      var doc = new DOMParser().parseFromString(html, 'text/html');

      doc.querySelectorAll('link[rel="stylesheet"], style').forEach(function (n) {
        if (n.tagName === 'LINK') {
          var href = n.getAttribute('href') || '';
          if (href && href.indexOf('http') !== 0)
            href = CDN + PIN + '/' + href.replace(/^\.\//, '').split('?')[0] + '?v=943';
          n.setAttribute('href', href);
          document.head.appendChild(document.importNode(n, true));
        } else {
          document.head.appendChild(document.importNode(n, true));
        }
      });

      var bodyHtml = '';
      Array.prototype.forEach.call(doc.body.childNodes, function (node) {
        if (node.nodeName === 'SCRIPT') return;
        if (node.nodeType === 1) bodyHtml += node.outerHTML;
        else if (node.nodeType === 3) bodyHtml += node.textContent;
      });
      document.body.innerHTML = bodyHtml;

      window.__DR_ECG_OK = true;
      try {
        document.documentElement.setAttribute('data-ecg', 'on');
        document.documentElement.setAttribute('data-theme', 'dark');
        localStorage.setItem('dr_theme', 'dark');
      } catch (e1) {}

      /* Core app scripts only — sequential but few */
      var core = [];
      doc.querySelectorAll('script[src]').forEach(function (sc) {
        var src = sc.getAttribute('src') || '';
        if (!src) return;
        if (src.indexOf('http') !== 0)
          src = CDN + PIN + '/' + src.replace(/^\.\//, '').split('?')[0] + '?v=943';
        core.push(src);
      });
      for (var c = 0; c < core.length; c++) await loadSync(core[c]);

      /* Login essentials — non-blocking async */
      [
        '90094058c1f476b163296855e186984add6a625d/js/bg-anim-pin.js',
        'a9046e485443b24e800a4f4d10747c10146ca663/js/heartbeat-draw.js',
        '8c56504dc4ae1c397eb336de3d117dd3bd022ed7/js/login-theme.js',
        '9beff1f92931/js/login-tab-labels.js',
        '233f36150987e8576aab9114d1ca329bf09fa6a0/js/login-nav-fix.js',
        '8afd47c0aa694ef7483f413d2ad7c15ea2be7b30/js/login-shell-sep.js'
      ].forEach(function (p) { inject(CDN + p + '?v=943', false); });

      /* Portal features — deferred, load after idle so login never freezes */
      function loadPortal() {
        [
          '9a17dcda7cbe5a9ad3f9af120b4135532b149a13/js/admin-portal-lock.js',
          '545afd29cbaede602653f78631d8c97ce7558683/js/sidebar-profile-layout.js',
          'cf85fe34e66bb092edf09e521e0ef0879071354a/js/sidebar-role-label.js',
          '39e8c69ab7c04cb4900cc40992419ecffb482735/js/supabase-400-fix.js',
          '51facff11f44ff41c897107bad8583c6f9d5f3bf/js/avatar-fix.js',
          'e65c070009674e02288c96a305daab5e0245e28e/js/filters.js',
          '5fa3d4a86e002268a75ed1068d1f96259ecb9344/js/priority-p1-display.js',
          'd987fd7a6e51a612230c882e1da3138486010593/js/ticket-stable.js',
          '895cb8b253e0fab3ad79e2d06fa06f30feded687/js/ticket-card-render.js',
          '4326d1ddf5e9a5628834aa36f87999d7e0a4b87a/js/ticket-card-css.js',
          '875b2f5b1c8293bb219943429c01020f28114d5b/js/ticket-list-fix.js',
          '7a09542332b8227930871a5a055162c570a3fdb7/js/csat-dashboard.js',
          '53aba5366d53c7fc6c8208ecb594eeeb10d46e2f/js/admin.js'
        ].forEach(function (p) { inject(CDN + p + '?v=943', true); });
      }

      if (window.requestIdleCallback) {
        requestIdleCallback(loadPortal, { timeout: 3000 });
      } else {
        setTimeout(loadPortal, 1500);
      }

      /* Hide Light button once if present */
      setTimeout(function () {
        try {
          document.documentElement.setAttribute('data-theme', 'dark');
          localStorage.setItem('dr_theme', 'dark');
          var tb = document.getElementById('btn-theme') || document.querySelector('[data-theme-toggle]');
          if (tb) { tb.style.display = 'none'; tb.hidden = true; }
          document.querySelectorAll('button').forEach(function (b) {
            if ((b.textContent || '').trim() === 'Light') { b.style.display = 'none'; }
          });
          if (window.DRBgAnimPin && window.DRBgAnimPin.refresh) window.DRBgAnimPin.refresh();
        } catch (e) {}
      }, 600);
    } catch (err) {
      var boot = document.getElementById('boot');
      if (boot) boot.innerHTML = '<p style="color:#fca5a5">Could not load.</p><button onclick="location.reload()">Retry</button>';
    }
  })();
  </script>
</body>
</html>
