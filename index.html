  <script src="https://cdn.jsdelivr.net/gh/Lizer-WebCoder/divine-rays-tech-hub@545afd29cbaede602653f78631d8c97ce7558683/js/sidebar-profile-layout.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/Lizer-WebCoder/divine-rays-tech-hub@bef23962c979e19d937950b628f10649f3f10b2f/js/theme.js"></script>
  <style>
    html,body{margin:0;min-height:100vh;font-family:Inter,system-ui,sans-serif;background:#0c0c14;color:#eeeef6}
    #boot{display:flex;align-items:center;justify-content:center;min-height:100vh;flex-direction:column;gap:1rem;text-align:center}
    #boot .t{font-size:1.25rem;font-weight:650;margin:0}
    #boot .s{font-size:.85rem;color:#9494ae;margin:0}
  </style>
</head>
<body>
  <div id="boot"><p class="t">Divine Rays Tech Hub</p><p class="s">Loading…</p></div>
  <script>
  (async function () {
    var SHELL = '6d66f6b647cf6f4c7340536dab472409bd1de5d6';
    var LOCK = '9a17dcda7cbe5a9ad3f9af120b4135532b149a13';
    var PROFILE = '545afd29cbaede602653f78631d8c97ce7558683';
    var CDN = 'https://cdn.jsdelivr.net/gh/Lizer-WebCoder/divine-rays-tech-hub@';
    var B = Date.now();
    try {
      var html = null;
      var urls = [
        'https://raw.githubusercontent.com/Lizer-WebCoder/divine-rays-tech-hub/' + SHELL + '/index.html?b=' + B,
        CDN + SHELL + '/index.html?b=' + B
      ];
      for (var i = 0; i < urls.length; i++) {
        try {
          var r = await fetch(urls[i], { cache: 'no-store', credentials: 'omit' });
          if (r.ok) { html = await r.text(); if (html && html.length > 5000) break; html = null; }
        } catch (e) {}
      }
      if (!html) throw new Error('Could not load app');
      if (html.indexOf('sidebar-profile-layout.js') === -1) {
        html = html.replace('</head>',
          '<script src="' + CDN + LOCK + '/js/admin-portal-lock.js?b=' + B + '"><\/script>' +
          '<script src="' + CDN + PROFILE + '/js/sidebar-profile-layout.js?b=' + B + '"><\/script></head>');
      }
      document.open();
      document.write(html);
      document.close();
    } catch (err) {
      document.getElementById('boot').innerHTML =
        '<p style="color:#fca5a5">Could not load app.</p>' +
        '<button onclick="location.reload()" style="margin-top:12px;padding:8px 14px;cursor:pointer">Retry</button>' +
        '<p style="color:#6b6b80;font-size:.8rem">' + String(err && err.message || err) + '</p>';
    }
  })();
  </script>
</body>
