<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Divine Rays Tech Hub — Support</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg?v=9.5.8" />
  <style>
    html,body{margin:0;background:#0c0c14;color:#eeeef6;font-family:Inter,system-ui,sans-serif;min-height:100vh}
    #boot{display:flex;align-items:center;justify-content:center;min-height:100vh;font-size:0.95rem;color:#9494ae;flex-direction:column;gap:0.75rem;padding:1.5rem;text-align:center}
    #boot .hint{font-size:0.8rem;color:#6b6b80;max-width:22rem}
  </style>
  <script>
  (function () {
    try {
      var t = localStorage.getItem('dr_theme') || 'dark';
      document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
    window.__DR_COMMENTS_LIVE = 8;
    window.__DR_COMMENTS_LIVE_V2 = 1;
    window.__DR_BOOT_CLEAN = 1;
  })();
  </script>
</head>
<body>
  <div id="boot">
    <div>Loading Divine Rays Tech Hub…</div>
    <div class="hint" id="boot-hint"></div>
  </div>
  <script>
  (async function () {
    var SHELL_SHA = '6d66f6b647cf6f4c7340536dab472409bd1de5d6';
    var TEAM_BOARD_SHA = '6f7d941cf16542de5868a7ed0abaacae83f4d133';
    var TEAM_SEP_SHA = '85337adc33ac049cdbf1317bbc20388b4f774739';
    var SIDEBAR_SHA = 'f54ca62b389e67557d902e630612372b9db32710';
    var SIDEBAR_ROLE_SHA = '44b94a0ad4abfd721e4b09d03a1eda83670d7a87';
    var APPROVAL_GATE_SHA = '95399ebc6bf10275331a35b96b9b589bf25b6d7b';
    var FORCE_PENDING_SHA = 'f3988b77a2f35efc5cd53a040d78a56becb58261';
    var PENDING_FIX_SHA = '94a5aeaaa38fafaaa1ac94872341ce3bf992dfd1';
    var LOGIN_TAB_SHA = '9beff1f929318ca08d9a71a1d4718ec4afebf539';
    var STAFF_NOTIF_SHA = 'ad42d4238ecd55ec0bb66aa9a842fe2c57b936bd';
    var REPLY_FIX_SHA = '5307c296fc8868d23fdc61bde79cad23f3c71dba';
    var COMMENTS_LIVE_SHA = '4181ae9900f29ec307555a38e62ae6be7e6b9a8f';
    var UI_LAYOUT_SHA = 'ce5a1fde308a9d38438b60df40497902b607690c';
    var KB_TABLE_SHA = '057efa589371be7a05114c786f31a89bb28fe009';
    var KB_JS_SHA = 'd4e9498db74b26a08bf7c8acec52ac3496c6ff86';
    var USERS_NAV_SHA = 'f87daa9cf712394f08b7c3150b834322e54f1265';
    var ADMIN_SHA = 'dd3d27c0c8190f4f85781c8f2477678d538768b0';
    var ADMIN_STATS_SHA = 'a84ce631450b3b57b11f852de982bf83206ea26b';
    var TOOLBAR_SHA = '2ea9190cbbb3dbfbf3a159ca47d585a61b2f6e2b';
    var FILTER_SHA = '1bfe6c0e93dedc361cf1f3e15eb520c3aea13930';
    var DESIGN_SHA = '7d6d66cbe63fda91cf71d64bbddd1af80f3adfc3';
    var TICKET_DESIGN_SHA = '01d6078d7a6a6ff64a1c9f53621d1bc2446156cf';
    var CUSTOMER_FILTER_SHA = 'a5994f1d821a6ec5e062fc9da71bcf2e320db780';
    var ENDUSER_PRO_SHA = '9fe374cd480c99d3530cbfc4c7d685292b24a29e';
    var ENDUSER_UI_SHA = 'b24dfa0434582866d862bd853c62b6685e90b1d8';
    var CDN = 'https://cdn.jsdelivr.net/gh/Lizer-WebCoder/divine-rays-tech-hub@';
    var BUST = String(Date.now());
    var TIP = 'dd3d27c0c8190f4f85781c8f2477678d538768b0';

    var REWRITE = {
      'admin.js': ADMIN_SHA,
      'users-nav.js': USERS_NAV_SHA,
      'comments-live.js': COMMENTS_LIVE_SHA,
      'team-sep.js': TEAM_SEP_SHA,
      'team-board.js': TEAM_BOARD_SHA,
      'kb.js': KB_JS_SHA,
      'agent-approval-gate.js': APPROVAL_GATE_SHA,
      'force-pending-block.js': FORCE_PENDING_SHA,
      'pending-approved-fix.js': PENDING_FIX_SHA,
      'login-tab-labels.js': LOGIN_TAB_SHA,
      'staff-ticket-notifs.js': STAFF_NOTIF_SHA,
      'customer-reply-fix.js': REPLY_FIX_SHA,
      'sidebar-design.js': SIDEBAR_SHA,
      'sidebar-role-label.js': SIDEBAR_ROLE_SHA,
      'design-system-v10.js': DESIGN_SHA,
      'ticket-list-design.js': TICKET_DESIGN_SHA,
      'customer-my-tickets-filter.js': CUSTOMER_FILTER_SHA,
      'enduser-pro.js': ENDUSER_PRO_SHA,
      'enduser-ui.js': ENDUSER_UI_SHA
    };

    var SKIP = {
      'ui-flicker-fix.js': 1,
      'content-restore.js': 1,
      'card-opacity.js': 1,
      'smooth-refresh.js': 1,
      'ux-dashboard-detail.js': 1,
      'ux-session-polish.js': 1,
      'customer-pro-ui.js': 1
    };

    var bootHint = document.getElementById('boot-hint');
    var bootTimer = setTimeout(function () {
      if (bootHint) {
        bootHint.textContent =
          'Still loading… Hard refresh with Ctrl+Shift+R (Cmd+Shift+R on Mac).';
      }
    }, 12000);

    function withBust(u) {
      return u + (u.indexOf('?') === -1 ? '?' : '&') + 'b=' + BUST;
    }

    var loaded = {};
    function loadScript(src) {
      var base = (src.match(/\/js\/([^/?#]+)/) || [])[1] || src;
      if (loaded[base] || SKIP[base]) return Promise.resolve(src);
      loaded[base] = 1;
      return new Promise(function (resolve) {
        var s = document.createElement('script');
        s.src = withBust(src);
        s.async = false;
        s.onload = function () { resolve(src); };
        s.onerror = function () { resolve(src); };
        (document.body || document.documentElement).appendChild(s);
      });
    }

    var urls = [
      'https://raw.githubusercontent.com/Lizer-WebCoder/divine-rays-tech-hub/' + SHELL_SHA + '/index.html',
      CDN + SHELL_SHA + '/index.html'
    ];

    try {
      var html = null;
      for (var i = 0; i < urls.length; i++) {
        try {
          var r = await fetch(withBust(urls[i]), { cache: 'no-store', credentials: 'omit' });
          if (r.ok) {
            html = await r.text();
            break;
          }
        } catch (e) {}
      }
      if (!html) throw new Error('Could not load app shell');

      html = html.replace(
        /var LIVE_SHA = '[^']*';/,
        "var LIVE_SHA = '" + COMMENTS_LIVE_SHA + "';"
      );
      html = html.replace(
        /var KB_JS_SHA = '[^']*';/,
        "var KB_JS_SHA = '" + KB_JS_SHA + "';"
      );

      html = html.replace(
        /var EXTRA_FILES = \[[^\]]*\];/,
        "var EXTRA_FILES = ['email-notify.js','ticket-plus.js','ticket-plus-fix.js','status-lock.js','kb.js','polish-fixes.js'];"
      );

      html = html.replace(
        /https:\/\/cdn\.jsdelivr\.net\/gh\/Lizer-WebCoder\/divine-rays-tech-hub@[a-f0-9]+\/js\/([a-z0-9._-]+\.js)/gi,
        function (full, name) {
          if (SKIP[name]) return full;
          if (REWRITE[name]) return CDN + REWRITE[name] + '/js/' + name;
          return full;
        }
      );

      Object.keys(SKIP).forEach(function (name) {
        var re = new RegExp(
          'await loadScript\\([^)]*' + name.replace(/\./g, '\\.') + '[^)]*\\);',
          'gi'
        );
        html = html.replace(re, '/* skipped ' + name + ' */');
      });

      html = html.replace(
        '<head>',
        '<head><script>window.__DR_COMMENTS_LIVE=8;window.__DR_COMMENTS_LIVE_V2=1;window.__DR_BOOT_CLEAN=1;<\/script>'
      );

      document.open();
      document.write(html);
      document.close();
      clearTimeout(bootTimer);

      setTimeout(function () {
        loadScript(CDN + LOGIN_TAB_SHA + '/js/login-tab-labels.js');
        loadScript(CDN + FORCE_PENDING_SHA + '/js/force-pending-block.js');
        loadScript(CDN + APPROVAL_GATE_SHA + '/js/agent-approval-gate.js');
        loadScript(CDN + PENDING_FIX_SHA + '/js/pending-approved-fix.js');
        loadScript(CDN + SIDEBAR_ROLE_SHA + '/js/sidebar-role-label.js');
      }, 50);

      setTimeout(function () {
        Promise.all([
          loadScript(CDN + DESIGN_SHA + '/js/design-system-v10.js'),
          loadScript(CDN + TIP + '/js/polish-fixes.js'),
          loadScript(CDN + TIP + '/js/ui-polish.js'),
          loadScript(CDN + TIP + '/js/ui-fixes-v11.js'),
          loadScript(CDN + TOOLBAR_SHA + '/js/ui-toolbar-fix.js'),
          loadScript(CDN + SIDEBAR_SHA + '/js/sidebar-design.js'),
          loadScript(CDN + SIDEBAR_ROLE_SHA + '/js/sidebar-role-label.js'),
          loadScript(CDN + TEAM_BOARD_SHA + '/js/team-board.js'),
          loadScript(CDN + TEAM_SEP_SHA + '/js/team-sep.js'),
          loadScript(CDN + COMMENTS_LIVE_SHA + '/js/comments-live.js'),
          loadScript(CDN + REPLY_FIX_SHA + '/js/customer-reply-fix.js'),
          loadScript(CDN + UI_LAYOUT_SHA + '/js/ui-layout-notifs.js'),
          loadScript(CDN + KB_TABLE_SHA + '/js/kb-table-fix.js'),
          loadScript(CDN + KB_JS_SHA + '/js/kb.js'),
          loadScript(CDN + ADMIN_SHA + '/js/admin.js'),
          loadScript(CDN + ADMIN_STATS_SHA + '/js/admin-stats-fix.js'),
          loadScript(CDN + USERS_NAV_SHA + '/js/users-nav.js'),
          loadScript(CDN + FILTER_SHA + '/js/users-filter-enforce.js'),
          loadScript(CDN + FORCE_PENDING_SHA + '/js/force-pending-block.js'),
          loadScript(CDN + APPROVAL_GATE_SHA + '/js/agent-approval-gate.js'),
          loadScript(CDN + PENDING_FIX_SHA + '/js/pending-approved-fix.js'),
          loadScript(CDN + LOGIN_TAB_SHA + '/js/login-tab-labels.js'),
          loadScript(CDN + STAFF_NOTIF_SHA + '/js/staff-ticket-notifs.js'),
          loadScript(CDN + TICKET_DESIGN_SHA + '/js/ticket-list-design.js'),
          loadScript(CDN + CUSTOMER_FILTER_SHA + '/js/customer-my-tickets-filter.js'),
          loadScript(CDN + ENDUSER_PRO_SHA + '/js/enduser-pro.js'),
          loadScript(CDN + ENDUSER_UI_SHA + '/js/enduser-ui.js')
        ]).then(function () {
          try { if (window.DRUsersNav && window.DRUsersNav.refresh) window.DRUsersNav.refresh(); } catch (e) {}
          try { if (window.DRSidebarDesign && window.DRSidebarDesign.refresh) window.DRSidebarDesign.refresh(); } catch (e2) {}
          try { if (window.DRStaffNotifs && window.DRStaffNotifs.refresh) window.DRStaffNotifs.refresh(); } catch (e3) {}
          try { if (window.DRCommentsLive && window.DRCommentsLive.refresh) window.DRCommentsLive.refresh(); } catch (e4) {}
          try { if (window.DRUsersFilterEnforce && window.DRUsersFilterEnforce.refresh) window.DRUsersFilterEnforce.refresh(); } catch (e5) {}
          try { if (window.DRCustomerMyTicketsFilter && window.DRCustomerMyTicketsFilter.refresh) window.DRCustomerMyTicketsFilter.refresh(); } catch (e6) {}
          try { if (window.DREndUserPro && window.DREndUserPro.refresh) window.DREndUserPro.refresh(); } catch (e7) {}
          try { if (window.DREndUserUI && window.DREndUserUI.refresh) window.DREndUserUI.refresh(); } catch (e8) {}
        });
      }, 1600);

    } catch (err) {
      clearTimeout(bootTimer);
      var boot = document.getElementById('boot');
      if (boot) {
        boot.innerHTML =
          '<div>Load error: ' +
          (err.message || err) +
          '</div><div class="hint">Hard refresh (Ctrl+Shift+R) and try again.</div>';
      }
    }
  })();
  </script>
</body>
</html>
