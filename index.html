<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <title>Divine Rays Tech Hub — Support</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg?v=935" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/Lizer-WebCoder/divine-rays-tech-hub@830dac02096eb08be1b2dc22bdc191a14df91a04/css/styles.css?v=935" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/gh/Lizer-WebCoder/divine-rays-tech-hub@830dac02096eb08be1b2dc22bdc191a14df91a04/js/config.js?v=935"></script>
  <style>
    html,body{margin:0;min-height:100vh;background:#0c0c14;color:#eeeef6}
    .portal{display:none}
    .portal.active{display:flex;min-height:100vh}
    #login-screen.hidden{display:none!important}
  </style>
</head>
<body>
  <div id="toast-container"></div>
  <div id="login-screen" class="login-screen">
    <div class="login-card">
      <div class="login-brand">
        <div class="logo">✦</div>
        <h1>Divine Rays Tech Hub</h1>
        <p>Support Portal</p>
      </div>
      <div class="login-tabs">
        <button type="button" class="ltab active" data-ltab="customer" onclick="window.switchLoginTab && switchLoginTab('customer')">Employee</button>
        <button type="button" class="ltab" data-ltab="agent" onclick="window.switchLoginTab && switchLoginTab('agent')">Admin</button>
      </div>
      <form id="login-customer" class="login-form active">
        <div class="form-group"><label for="cust-email">Username</label><input type="text" id="cust-email" name="username" required placeholder="you@company.com" autocomplete="username" /></div>
        <div class="form-group"><label for="cust-password">Password</label><input type="password" id="cust-password" name="password" required placeholder="••••••••" autocomplete="current-password" /></div>
        <button type="submit" class="btn btn-primary btn-full">Sign In</button>
        <p class="login-switch">New here? <a href="javascript:void(0)" onclick="window.showForm && showForm('register-customer'); return false;">Create an account</a></p>
      </form>
      <form id="register-customer" class="login-form">
        <div class="form-group"><label for="reg-cust-name">Full Name</label><input type="text" id="reg-cust-name" required /></div>
        <div class="form-group"><label for="reg-cust-email">Email</label><input type="email" id="reg-cust-email" required /></div>
        <div class="form-group"><label for="reg-cust-password">Password</label><input type="password" id="reg-cust-password" required minlength="4" /></div>
        <button type="submit" class="btn btn-primary btn-full">Create End-User Account</button>
        <p class="login-switch">Already have an account? <a href="javascript:void(0)" onclick="window.showForm && showForm('login-customer'); return false;">Sign in</a></p>
      </form>
      <form id="login-agent" class="login-form">
        <div class="form-group"><label for="agent-username">Email</label><input type="text" id="agent-username" name="username" required autocomplete="username" /></div>
        <div class="form-group"><label for="agent-password">Password</label><input type="password" id="agent-password" name="password" required autocomplete="current-password" /></div>
        <button type="submit" class="btn btn-primary btn-full">Sign In</button>
        <p class="login-switch"><a href="javascript:void(0)" onclick="window.showForm && showForm('register-agent'); return false;">Create Admin account</a></p>
      </form>
      <form id="register-agent" class="login-form">
        <div class="form-group"><label for="reg-agent-name">Full Name</label><input type="text" id="reg-agent-name" required /></div>
        <div class="form-group"><label for="reg-agent-email">Work Email</label><input type="email" id="reg-agent-email" required /></div>
        <div class="form-group"><label for="reg-agent-username">Username</label><input type="text" id="reg-agent-username" required /></div>
        <div class="form-group"><label for="reg-agent-password">Password</label><input type="password" id="reg-agent-password" required minlength="4" /></div>
        <button type="submit" class="btn btn-primary btn-full">Create Admin Account</button>
        <p class="login-switch">Already have an account? <a href="javascript:void(0)" onclick="window.showForm && showForm('login-agent'); return false;">Sign in</a></p>
      </form>
      <p class="login-footer" style="text-align:center;opacity:.55;font-size:.75rem;margin-top:1rem">Boys at the Back LRK · All Rights Reserved</p>
    </div>
  </div>
  <div id="portal-agent" class="portal">
    <aside class="sidebar">
      <div class="brand"><div class="brand-text"><h1>Divine Rays</h1><p>Tech Support</p></div></div>
      <div class="agent-badge"><span id="agent-name-display">Agent</span></div>
      <nav class="nav">
        <button type="button" class="nav-btn active" data-view="dashboard">Dashboard</button>
        <button type="button" class="nav-btn" data-view="my">My Tickets</button>
        <button type="button" class="nav-btn" data-view="unassigned">Unassigned</button>
        <button type="button" class="nav-btn" data-view="all">All Tickets</button>
        <button type="button" class="nav-btn" data-view="users">Users</button>
      </nav>
    </aside>
    <main class="main">
      <div class="topbar mode-bar"><span id="page-title">Dashboard</span><div class="user-info"></div></div>
      <div id="dashboard-root"></div>
      <div id="ticket-list"></div>
    </main>
  </div>
  <div id="portal-customer" class="portal">
    <aside class="sidebar">
      <div class="brand"><h1>Divine Rays</h1></div>
      <nav class="nav"><button type="button" class="nav-btn active" data-view="my">My Tickets</button></nav>
    </aside>
    <main class="main"><div id="cust-ticket-list"></div></main>
  </div>
  <script>
  (function () {
    function switchLoginTab(tab) {
      tab = tab === 'agent' ? 'agent' : 'customer';
      document.querySelectorAll('.ltab').forEach(function (b) {
        b.classList.toggle('active', b.getAttribute('data-ltab') === tab);
      });
      document.querySelectorAll('form.login-form').forEach(function (f) { f.classList.remove('active'); });
      var f = document.getElementById(tab === 'agent' ? 'login-agent' : 'login-customer');
      if (f) f.classList.add('active');
    }
    function showForm(id) {
      document.querySelectorAll('form.login-form').forEach(function (f) { f.classList.remove('active'); });
      var f = document.getElementById(id);
      if (f) f.classList.add('active');
      var tab = (id || '').indexOf('agent') !== -1 ? 'agent' : 'customer';
      document.querySelectorAll('.ltab').forEach(function (b) {
        b.classList.toggle('active', b.getAttribute('data-ltab') === tab);
      });
    }
    window.switchLoginTab = switchLoginTab;
    window.showForm = showForm;
  })();
  </script>
  <script src="https://cdn.jsdelivr.net/gh/Lizer-WebCoder/divine-rays-tech-hub@830dac02096eb08be1b2dc22bdc191a14df91a04/js/app.js?v=935"></script>
  <script src="https://cdn.jsdelivr.net/gh/Lizer-WebCoder/divine-rays-tech-hub@830dac02096eb08be1b2dc22bdc191a14df91a04/js/admin.js?v=935"></script>
  <script src="https://cdn.jsdelivr.net/gh/Lizer-WebCoder/divine-rays-tech-hub@830dac02096eb08be1b2dc22bdc191a14df91a04/js/filters.js?v=935"></script>
  <script src="https://cdn.jsdelivr.net/gh/Lizer-WebCoder/divine-rays-tech-hub@830dac02096eb08be1b2dc22bdc191a14df91a04/js/extras.js?v=935"></script>
  <script src="https://cdn.jsdelivr.net/gh/Lizer-WebCoder/divine-rays-tech-hub@830dac02096eb08be1b2dc22bdc191a14df91a04/js/polish.js?v=935"></script>
  <script src="https://cdn.jsdelivr.net/gh/Lizer-WebCoder/divine-rays-tech-hub@8c56504dc4ae1c397eb336de3d117dd3bd022ed7/js/login-theme.js?v=935"></script>
  <script src="https://cdn.jsdelivr.net/gh/Lizer-WebCoder/divine-rays-tech-hub@233f36150987e8576aab9114d1ca329bf09fa6a0/js/login-nav-fix.js?v=935"></script>
  <script src="https://cdn.jsdelivr.net/gh/Lizer-WebCoder/divine-rays-tech-hub@8afd47c0aa694ef7483f413d2ad7c15ea2be7b30/js/login-shell-sep.js?v=935"></script>
  <script src="https://cdn.jsdelivr.net/gh/Lizer-WebCoder/divine-rays-tech-hub@9beff1f92931/js/login-tab-labels.js?v=935"></script>
  <script src="https://cdn.jsdelivr.net/gh/Lizer-WebCoder/divine-rays-tech-hub@9a17dcda7cbe5a9ad3f9af120b4135532b149a13/js/admin-portal-lock.js?v=935"></script>
  <script src="https://cdn.jsdelivr.net/gh/Lizer-WebCoder/divine-rays-tech-hub@545afd29cbaede602653f78631d8c97ce7558683/js/sidebar-profile-layout.js?v=935"></script>
  <script src="https://cdn.jsdelivr.net/gh/Lizer-WebCoder/divine-rays-tech-hub@bef23962c979e19d937950b628f10649f3f10b2f/js/theme.js?v=935"></script>
  <script src="https://cdn.jsdelivr.net/gh/Lizer-WebCoder/divine-rays-tech-hub@a9046e485443b24e800a4f4d10747c10146ca663/js/heartbeat-draw.js?v=935"></script>
  <script src="https://cdn.jsdelivr.net/gh/Lizer-WebCoder/divine-rays-tech-hub@90094058c1f476b163296855e186984add6a625d/js/bg-anim-pin.js?v=935"></script>
  <script src="https://cdn.jsdelivr.net/gh/Lizer-WebCoder/divine-rays-tech-hub@e65c070009674e02288c96a305daab5e0245e28e/js/filters.js?v=935"></script>
  <script src="https://cdn.jsdelivr.net/gh/Lizer-WebCoder/divine-rays-tech-hub@cf85fe34e66bb092edf09e521e0ef0879071354a/js/sidebar-role-label.js?v=935"></script>
  <script src="https://cdn.jsdelivr.net/gh/Lizer-WebCoder/divine-rays-tech-hub@5fa3d4a86e002268a75ed1068d1f96259ecb9344/js/priority-p1-display.js?v=935"></script>
  <script src="https://cdn.jsdelivr.net/gh/Lizer-WebCoder/divine-rays-tech-hub@7a09542332b8227930871a5a055162c570a3fdb7/js/csat-dashboard.js?v=935"></script>
</body>
</html>
