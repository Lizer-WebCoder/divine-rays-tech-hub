<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <title>Divine Rays Tech Hub — Support</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg?v=937" />
  <script src="https://cdn.jsdelivr.net/gh/Lizer-WebCoder/divine-rays-tech-hub@9a17dcda7cbe5a9ad3f9af120b4135532b149a13/js/admin-portal-lock.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/Lizer-WebCoder/divine-rays-tech-hub@545afd29cbaede602653f78631d8c97ce7558683/js/sidebar-profile-layout.js"></script>
  <style>
    html,body{margin:0;min-height:100vh;background:#0c0c14;color:#eeeef6;font-family:Inter,system-ui,sans-serif}
    #boot{display:flex;align-items:center;justify-content:center;min-height:100vh;font-size:.95rem;color:#9494ae}
  </style>
</head>
<body>
  <div id="boot">Loading Divine Rays Tech Hub…</div>
  <script>
  (async function () {
    var B = Date.now();
    var CDN = 'https://cdn.jsdelivr.net/gh/Lizer-WebCoder/divine-rays-tech-hub@';
    var LOADER = '6d66f6b647cf6f4c7340536dab472409bd1de5d6';
    try {
      var r = await fetch(CDN + LOADER + '/index.html?b=' + B, { cache: 'no-store', credentials: 'omit' });
      if (!r.ok) {
        r = await fetch('https://raw.githubusercontent.com/Lizer-WebCoder/divine-rays-tech-hub/' + LOADER + '/index.html?b=' + B, { cache: 'no-store' });
      }
      if (!r.ok) throw new Error('Could not load production shell');
      var html = await r.text();

      document.open();
      document.write(html);
      document.close();

      setTimeout(function () {
        function load(src) {
          var s = document.createElement('script');
          s.src = src + (src.indexOf('?') >= 0 ? '&' : '?') + 'v=937';
          s.async = false;
          document.body.appendChild(s);
        }
        document.querySelectorAll('.ltab').forEach(function (btn) {
          var tab = (btn.getAttribute('data-ltab') || '').toLowerCase();
          if (tab === 'customer') btn.textContent = 'Employee';
          else if (tab === 'agent') btn.textContent = 'Admin';
        });
        var pins = [
          '9beff1f92931/js/login-tab-labels.js',
          '9a17dcda7cbe5a9ad3f9af120b4135532b149a13/js/admin-portal-lock.js',
          '545afd29cbaede602653f78631d8c97ce7558683/js/sidebar-profile-layout.js',
          'cf85fe34e66bb092edf09e521e0ef0879071354a/js/sidebar-role-label.js',
          'a9046e485443b24e800a4f4d10747c10146ca663/js/heartbeat-draw.js',
          '90094058c1f476b163296855e186984add6a625d/js/bg-anim-pin.js',
          'e65c070009674e02288c96a305daab5e0245e28e/js/filters.js',
          '5fa3d4a86e002268a75ed1068d1f96259ecb9344/js/priority-p1-display.js',
          '895cb8b253e0fab3ad79e2d06fa06f30feded687/js/ticket-card-render.js',
          '4326d1ddf5e9a5628834aa36f87999d7e0a4b87a/js/ticket-card-css.js',
          'bef23962c979e19d937950b628f10649f3f10b2f/js/theme.js'
        ];
        pins.forEach(function (p) { load(CDN + p); });
      }, 2500);
    } catch (err) {
      var boot = document.getElementById('boot');
      if (boot) boot.innerHTML = '<p style="color:#fca5a5">Could not load system.</p><button onclick="location.reload()">Retry</button><p style="font-size:.8rem;color:#6b6b80">' + String(err && err.message || err) + '</p>';
    }
  })();
  </script>
</body>
</html>
