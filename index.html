<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <title>Divine Rays Tech Hub — Support</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg?v=929" />
  <link rel="stylesheet" href="css/styles.css?v=929" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js?v=929"></script>
  <style>
    html,body{margin:0;min-height:100vh;background:#0c0c14;color:#eeeef6;font-family:Inter,system-ui,sans-serif}
    .portal{display:none}
    .portal.active{display:flex;min-height:100vh}
    #login-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:1.5rem}
    #login-screen.hidden{display:none!important}
    .login-card{width:100%;max-width:380px;background:#16161f;border:1px solid rgba(167,139,250,.25);border-radius:16px;padding:1.5rem;box-shadow:0 12px 40px rgba(0,0,0,.4)}
    .login-brand{text-align:center;margin-bottom:1rem}
    .login-brand h1{margin:.4rem 0 0;font-size:1.2rem}
    .login-brand p{margin:.2rem 0 0;color:#9494ae;font-size:.85rem}
    .login-tabs{display:flex;gap:.5rem;margin-bottom:1rem}
    .ltab{flex:1;padding:.55rem;border-radius:10px;border:1px solid rgba(167,139,250,.2);background:transparent;color:#c4c0de;cursor:pointer}
    .ltab.active{background:rgba(124,106,240,.25);color:#fff;border-color:rgba(124,106,240,.5)}
    .login-form{display:none;flex-direction:column;gap:.75rem}
    .login-form.active{display:flex}
    .login-form label{display:flex;flex-direction:column;gap:.3rem;font-size:.8rem;color:#a8a4c0}
    .login-form input{padding:.65rem .75rem;border-radius:10px;border:1px solid rgba(167,139,250,.25);background:#0e0e16;color:#fff}
    .btn.primary{padding:.7rem;border:none;border-radius:10px;background:linear-gradient(135deg,#7c6af0,#5b46c8);color:#fff;font-weight:600;cursor:pointer}
  </style>
</head>
<body>
  <div id="toast-container"></div>
  <div id="login-screen" class="login-screen">
    <div class="login-card">
      <div class="login-brand"><div class="logo">✦</div><h1>Divine Rays Tech Hub</h1><p>Support Portal</p></div>
      <div class="login-tabs">
        <button type="button" class="ltab active" data-ltab="customer" id="tab-customer">Employee</button>
        <button type="button" class="ltab" data-ltab="agent" id="tab-agent">Admin</button>
      </div>
      <form id="login-customer" class="login-form active">
        <label>Username<input name="username" autocomplete="username" required /></label>
        <label>Password<input name="password" type="password" autocomplete="current-password" required /></label>
        <button type="submit" class="btn primary">Sign in</button>
      </form>
      <form id="login-agent" class="login-form">
        <label>Username<input name="username" autocomplete="username" required /></label>
        <label>Password<input name="password" type="password" autocomplete="current-password" required /></label>
        <button type="submit" class="btn primary">Sign in</button>
      </form>
    </div>
  </div>
  <div id="portal-agent" class="portal">
    <aside class="sidebar">
      <div class="brand"><div class="brand-text"><h1>Divine Rays</h1><p>Tech Support</p></div></div>
      <div class="agent-badge"><span id="agent-name-display">Agent</span></div>
      <nav class="nav">
        <button type="button" class="nav-btn active" data-view="dashboard">Dashboard</button>
        <button type="button" class="nav-btn" data-view="my">My Tickets</button>
        <button type="button" class="nav-btn" data-view="unassigned">Unassigned</button>
        <button type="button" class="nav-btn" data-view="all">All Tickets</button>
        <button type="button" class="nav-btn" data-view="users">Users</button>
      </nav>
    </aside>
    <main class="main">
      <div class="topbar mode-bar"><span id="page-title">Dashboard</span><div class="user-info"></div></div>
      <div id="ticket-list"></div>
      <div id="dashboard-root"></div>
    </main>
  </div>
  <div id="portal-customer" class="portal">
    <aside class="sidebar"><div class="brand"><h1>Divine Rays</h1></div><nav class="nav"><button type="button" class="nav-btn active">My Tickets</button></nav></aside>
    <main class="main"><div id="cust-ticket-list"></div></main>
  </div>
  <script>
  (function(){
    function switchTab(tab){
      document.querySelectorAll('.ltab').forEach(function(b){ b.classList.toggle('active', b.getAttribute('data-ltab')===tab); });
      document.querySelectorAll('.login-form').forEach(function(f){ f.classList.remove('active'); });
      var f=document.getElementById(tab==='agent'?'login-agent':'login-customer');
      if(f) f.classList.add('active');
    }
    document.getElementById('tab-customer').onclick=function(){ switchTab('customer'); };
    document.getElementById('tab-agent').onclick=function(){ switchTab('agent'); };
  })();
  </script>
  <script src="https://cdn.jsdelivr.net/gh/Lizer-WebCoder/divine-rays-tech-hub@abdc47355c0342744e79b8545458cd7d729f93d1/js/app.js?v=929"></script>
  <script src="https://cdn.jsdelivr.net/gh/Lizer-WebCoder/divine-rays-tech-hub@9a17dcda7cbe5a9ad3f9af120b4135532b149a13/js/admin-portal-lock.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/Lizer-WebCoder/divine-rays-tech-hub@545afd29cbaede602653f78631d8c97ce7558683/js/sidebar-profile-layout.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/Lizer-WebCoder/divine-rays-tech-hub@bef23962c979e19d937950b628f10649f3f10b2f/js/theme.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/Lizer-WebCoder/divine-rays-tech-hub@a9046e485443b24e800a4f4d10747c10146ca663/js/heartbeat-draw.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/Lizer-WebCoder/divine-rays-tech-hub@90094058c1f476b163296855e186984add6a625d/js/bg-anim-pin.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/Lizer-WebCoder/divine-rays-tech-hub@e65c070009674e02288c96a305daab5e0245e28e/js/filters.js"></script>
</body>
</html>
