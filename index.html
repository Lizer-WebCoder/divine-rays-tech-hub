<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <style>
    html,body{margin:0;min-height:100vh;background:#0c0c14;color:#eeeef6;font-family:Inter,system-ui,sans-serif}

  </style>
</head>
<body>
  <div id="boot">Loading Divine Rays Tech Hub…</div>
  <script>
  (async function () {
    var B = Date.now();
    var urls = [
      'https://cdn.jsdelivr.net/gh/Lizer-WebCoder/divine-rays-tech-hub@830dac02096eb08be1b2dc22bdc191a14df91a04/index.html?b=' + B,
      'https://raw.githubusercontent.com/Lizer-WebCoder/divine-rays-tech-hub/830dac02096eb08be1b2dc22bdc191a14df91a04/index.html?b=' + B
    ];
    var html = null;
    for (var i = 0; i < urls.length; i++) {
      try {
        var r = await fetch(urls[i], { cache: 'no-store', credentials: 'omit' });
        if (r.ok) {
          var t = await r.text();
          if (t && t.indexOf('login-screen') !== -1) { html = t; break; }
        }
      } catch (e) {}
    }
    if (!html) {
      document.getElementById('boot').innerHTML = '<p style="color:#fca5a5">Could not load app. <button onclick="location.reload()">Retry</button></p>';
      return;
    }
    var doc = new DOMParser().parseFromString(html, 'text/html');
    doc.querySelectorAll('link[rel="stylesheet"], style').forEach(function (n) {
      if (n.tagName === 'LINK') {
        var href = n.getAttribute('href') || '';
        if (href && href.indexOf('http') !== 0) {
          href = 'https://cdn.jsdelivr.net/gh/Lizer-WebCoder/divine-rays-tech-hub@830dac02096eb08be1b2dc22bdc191a14df91a04/' + href.replace(/^\.\//, '').split('?')[0] + '?v=931';
          n.setAttribute('href', href);
        }
        document.head.appendChild(document.importNode(n, true));
      } else {
        document.head.appendChild(document.importNode(n, true));
      }
    });
    var bodyHtml = '';
    Array.prototype.forEach.call(doc.body.childNodes, function (node) {
      if (node.nodeName === 'SCRIPT') return;
      if (node.nodeType === 1) bodyHtml += node.outerHTML;
      else if (node.nodeType === 3) bodyHtml += node.textContent;
    });
    document.body.innerHTML = bodyHtml;

    function loadScript(src) {
      return new Promise(function (res) {
        var s = document.createElement('script');
        s.src = src;
        s.async = false;
        s.onload = function () { res(); };
        s.onerror = function () { res(); };
        document.body.appendChild(s);
      });
    }

    var CDN = 'https://cdn.jsdelivr.net/gh/Lizer-WebCoder/divine-rays-tech-hub@';
    var PIN = '830dac02096eb08be1b2dc22bdc191a14df91a04';
    var core = [];
    doc.querySelectorAll('script[src]').forEach(function (sc) {
      var src = sc.getAttribute('src') || '';
      if (!src) return;
      if (src.indexOf('http') !== 0) {
        src = CDN + PIN + '/' + src.replace(/^\.\//, '').split('?')[0] + '?v=931';
      }
      core.push(src);
    });
    for (var c = 0; c < core.length; c++) await loadScript(core[c]);

    var extras = [
      CDN + '9a17dcda7cbe5a9ad3f9af120b4135532b149a13/js/admin-portal-lock.js?v=931',
      CDN + '545afd29cbaede602653f78631d8c97ce7558683/js/sidebar-profile-layout.js?v=931',
      CDN + 'bef23962c979e19d937950b628f10649f3f10b2f/js/theme.js?v=931',
      CDN + 'a9046e485443b24e800a4f4d10747c10146ca663/js/heartbeat-draw.js?v=931',
      CDN + '90094058c1f476b163296855e186984add6a625d/js/bg-anim-pin.js?v=931',
      CDN + 'e65c070009674e02288c96a305daab5e0245e28e/js/filters.js?v=931',
      CDN + 'cf85fe34e66bb092edf09e521e0ef0879071354a/js/sidebar-role-label.js?v=931',
      CDN + '895cb8b253e0fab3ad79e2d06fa06f30feded687/js/ticket-card-render.js?v=931',
      CDN + '4326d1ddf5e9a5628834aa36f87999d7e0a4b87a/js/ticket-card-css.js?v=931'
    ];
    for (var j = 0; j < extras.length; j++) await loadScript(extras[j]);
  })();
  </script>
</body>
</html>
