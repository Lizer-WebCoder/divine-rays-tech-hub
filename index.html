    html,body{margin:0;min-height:100vh;background:#0c0c14;color:#eeeef6;font-family:Inter,system-ui,sans-serif}
    /* Branded boot / loading UI */
    #boot{
      display:flex;align-items:center;justify-content:center;min-height:100vh;
      flex-direction:column;gap:.85rem;position:relative;z-index:9999;
      background:radial-gradient(ellipse 80% 60% at 50% 40%,#1a1530 0%,#0c0c14 55%,#08080f 100%)
    }
    #boot .boot-gear{
      width:52px;height:52px;border-radius:14px;
      background:linear-gradient(135deg,#7c6af0,#a78bfa);
      display:grid;place-items:center;
      animation:bootSpin 2.2s linear infinite;
      box-shadow:0 0 24px rgba(124,106,240,.45)
    }
    #boot .boot-gear svg{width:28px;height:28px;fill:#fff}
    #boot p{margin:0;color:#9494ae;font-size:.95rem;letter-spacing:.02em}
    #boot .boot-bar{
      width:120px;height:3px;border-radius:2px;overflow:hidden;
      background:rgba(167,139,250,.15);margin-top:.15rem
    }
    #boot .boot-bar-fill{
      height:100%;width:40%;border-radius:2px;
      background:linear-gradient(90deg,#8b7cf0,#c4b5fd,#8b7cf0);
      background-size:200% 100%;
      animation:bootBar 1.4s ease-in-out infinite
    }
    @keyframes bootSpin{to{transform:rotate(360deg)}}
    @keyframes bootBar{
      0%{transform:translateX(-100%);background-position:0% 0}
      100%{transform:translateX(280%);background-position:100% 0}
    }
    /* Dark only — hide login-theme Light button before it paints */
    #dr-login-theme,#btn-theme,[data-theme-toggle],#theme-toggle,.theme-fab{
      display:none!important;visibility:hidden!important;pointer-events:none!important;
      width:0!important;height:0!important;overflow:hidden!important;opacity:0!important
    }
    /* ECG visible + glow — do NOT lock opacity (heartbeat pulse needs it) */
    #dr-lifeline{
      display:block!important;visibility:visible!important;
      pointer-events:none!important;
      position:fixed!important;inset:0!important;
      width:100%!important;height:100%!important;z-index:0!important
    }
    #dr-lifeline .dr-ecg-glow{
      stroke-width:3.8px!important;
      filter:drop-shadow(0 0 6px rgba(233,213,255,.95)) drop-shadow(0 0 14px rgba(167,139,250,.65))!important
    }
    #dr-lifeline .dr-ecg-core{

    function loadScript(src) {
      return new Promise(function (res) {
        var s = document.createElement('script');
        s.src = src;
        s.async = false;
        s.onload = function () { res(); };
        s.onerror = function () { res(); };
        document.body.appendChild(s);
      });
    }

    function killLightBtn() {
      try {
        document.documentElement.setAttribute('data-theme', 'dark');

        ['dr-login-theme', 'btn-theme', 'theme-toggle'].forEach(function (id) {

      } catch (e) {}
    }

    try {
      var html = null;
      var urls = [
        CDN + PIN + '/index.html?b=' + B,
        'https://raw.githubusercontent.com/Lizer-WebCoder/divine-rays-tech-hub/' + PIN + '/index.html?b=' + B
      ];
      for (var i = 0; i < urls.length; i++) {
        try {
          var r = await fetch(urls[i], { cache: 'no-store', credentials: 'omit' });
          if (r.ok) {
            var t = await r.text();
            if (t && t.indexOf('login-screen') !== -1) { html = t; break; }
          }
        } catch (e) {}
      }
      if (!html) throw new Error('Could not load app');

      html = html
        .replace(/>Customer</g, '>Employee<')
        .replace(/>Tech Support</g, '>Admin<')
        .replace(/Create Customer Account/g, 'Create End-User Account')
        .replace(/Sign In as Agent/g, 'Sign In')

        .replace(/LIZZZ\s*[·•\-]\s*ALL RIGHTS RESERVED/gi, 'Boys at the Back LRK · All Rights Reserved');

      var doc = new DOMParser().parseFromString(html, 'text/html');

      doc.querySelectorAll('link[rel="stylesheet"], style').forEach(function (n) {
        if (n.tagName === 'LINK') {
          var href = n.getAttribute('href') || '';
          if (href && href.indexOf('http') !== 0) {
            href = CDN + PIN + '/' + href.replace(/^\.\//, '').split('?')[0] + '?v=953';
            n.setAttribute('href', href);
          }
          document.head.appendChild(document.importNode(n, true));
        } else {
          document.head.appendChild(document.importNode(n, true));
        }
      });

      var bodyHtml = '';
      Array.prototype.forEach.call(doc.body.childNodes, function (node) {
        if (node.nodeName === 'SCRIPT') return;
        if (node.nodeType === 1) bodyHtml += node.outerHTML;
        else if (node.nodeType === 3) bodyHtml += node.textContent;
      });
      document.body.innerHTML = bodyHtml;

      window.__DR_ECG_OK = true;
      try {
        document.documentElement.setAttribute('data-ecg', 'on');

        localStorage.setItem('dr_theme', 'dark');

      killLightBtn();

        'cf85fe34e66bb092edf09e521e0ef0879071354a/js/sidebar-role-label.js',
        'cf94fa12898891abef9c93bf7b1ebd3a06883293/js/sidebar-design.js',
