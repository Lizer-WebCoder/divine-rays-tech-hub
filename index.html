  <style>
    html,body{margin:0;min-height:100vh;font-family:Inter,system-ui,-apple-system,sans-serif;background:radial-gradient(ellipse 80% 60% at 50% 40%,#1a1530 0%,#0c0c14 55%,#08080f 100%);color:#eeeef6}
    html[data-theme="light"],html[data-theme="light"] body{background:radial-gradient(ellipse 80% 60% at 50% 35%,#e8e4ff 0%,#f4f2ff 45%,#eceaf8 100%);color:#1a1625}
    #boot{display:flex;align-items:center;justify-content:center;min-height:100vh;flex-direction:column;gap:1.25rem;padding:1.5rem;text-align:center;box-sizing:border-box}
    #boot .boot-logo{width:72px;height:72px;border-radius:16px;box-shadow:0 8px 32px rgba(109,90,154,.35);animation:bootLogoPulse 2.2s ease-in-out infinite}
    #boot .boot-title{font-size:1.35rem;font-weight:650;letter-spacing:.02em;color:#eeeef6;margin:0;line-height:1.3}
    #boot .boot-sub{font-size:.85rem;color:#9494ae;margin:0;opacity:.9}
    #boot .boot-loader{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:.35rem;height:28px}
    #boot .boot-dot{width:8px;height:8px;border-radius:50%;background:#a78bfa;animation:bootDot 1.2s ease-in-out infinite}
    #boot .boot-dot:nth-child(2){animation-delay:.15s}
    #boot .boot-dot:nth-child(3){animation-delay:.3s}
    #boot .boot-bar{width:120px;height:3px;border-radius:2px;overflow:hidden;background:rgba(167,139,250,.15);margin-top:.15rem}
    #boot .boot-bar-fill{height:100%;width:40%;border-radius:2px;background:linear-gradient(90deg,#8b7cf0,#c4b5fd,#8b7cf0);background-size:200% 100%;animation:bootBar 1.4s ease-in-out infinite}
    #boot .hint{font-size:.8rem;color:#6b6b80;max-width:22rem;min-height:1.2em}
    @keyframes bootLogoPulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.04);opacity:.92}}
    @keyframes bootDot{0%,80%,100%{transform:translateY(0);opacity:.35}40%{transform:translateY(-6px);opacity:1}}
    @keyframes bootBar{0%{transform:translateX(-100%);background-position:0% 0}100%{transform:translateX(280%);background-position:100% 0}}
    #login-screen,.login-screen{background:transparent!important;background-image:none!important}
    #agent-name-display:not(.dr-presence-ready){opacity:0!important;min-height:1.6rem}
    .mode-bar,.topbar,#mode-bar{transition:none!important}
    body.dr-session-restoring #login-screen,body.dr-boot-holding #login-screen{display:none!important;visibility:hidden!important;opacity:0!important;pointer-events:none!important}
    body:has(#portal-agent.active) #login-screen,body.is-portal #login-screen{display:none!important;visibility:hidden!important;opacity:0!important}
  </style>
  <script>
  (function () {
    try { var t = localStorage.getItem('dr_theme') || 'dark'; document.documentElement.setAttribute('data-theme', t); } catch (e) {}
    try { document.documentElement.classList.add('dr-session-restoring'); } catch (e0) {}
    try { document.addEventListener('DOMContentLoaded', function () { try { document.body.classList.add('dr-session-restoring', 'dr-boot-holding'); } catch (e1) {} }); } catch (e2) {}
    window.__DR_COMMENTS_LIVE = 8; window.__DR_COMMENTS_LIVE_V2 = 1; window.__DR_BOOT_CLEAN = 1; window.__DR_ECG_OK = false;
  })();
  </script>

<body>
  <div id="boot" role="status" aria-live="polite" aria-label="Loading Divine Rays Tech Hub">

    <h1 class="boot-title">Divine Rays Tech Hub</h1>
    <p class="boot-sub">Loading…</p>
    <div class="boot-loader" aria-hidden="true"><span class="boot-dot"></span><span class="boot-dot"></span><span class="boot-dot"></span></div>
    <div class="boot-bar" aria-hidden="true"><div class="boot-bar-fill"></div></div>
    <div class="hint" id="boot-hint"></div>
  </div>
  <script>
  (async function () {
    var SHELL_SHA = '6d66f6b647cf6f4c7340536dab472409bd1de5d6';
    var ADMIN_LOCK_SHA = '9a17dcda7cbe5a9ad3f9af120b4135532b149a13';
    var SIDEBAR_PROFILE_SHA = '545afd29cbaede602653f78631d8c97ce7558683';
    var FILTERS_SHA = 'e65c070009674e02288c96a305daab5e0245e28e';
    var PRIORITY_P1_SHA = '5fa3d4a86e002268a75ed1068d1f96259ecb9344';
    var FORCE_LIGHT_BG_SHA = 'ebcbb4637a65511602a399006a8ccc29f346ecfa';
    var COMMENTS_LIVE_SHA = '4181ae9900f29ec307555a38e62ae6be7e6b9a8f';
    var CDN = 'https://cdn.jsdelivr.net/gh/Lizer-WebCoder/divine-rays-tech-hub@';
    var BUST = String(Date.now());
    var bootHint = document.getElementById('boot-hint');
    var bootTimer = setTimeout(function () {
      if (bootHint) bootHint.textContent = 'Still loading… Hard refresh with Ctrl+Shift+R (Cmd+Shift+R on Mac).';
    }, 12000);
    function withBust(u) { return u + (u.indexOf('?') === -1 ? '?' : '&') + 'b=' + BUST; }
    var loaded = {};
    function loadScript(src) {
      var base = (src.match(/\/js\/([^/?#]+)/) || [])[1] || src;
      if (loaded[base]) return Promise.resolve(src);
      loaded[base] = 1;
      return new Promise(function (resolve) {
        var s = document.createElement('script');
        s.src = withBust(src);
        s.async = false;
        s.onload = function () { resolve(src); };
        s.onerror = function () { resolve(src); };
        (document.body || document.documentElement).appendChild(s);
      });
    }
    var urls = [
      CDN + SHELL_SHA + '/index.html',
      'https://raw.githubusercontent.com/Lizer-WebCoder/divine-rays-tech-hub/' + SHELL_SHA + '/index.html'
    ];
    try {
      var html = null;
      for (var i = 0; i < urls.length; i++) {
        try {
          var r = await fetch(withBust(urls[i]), { cache: 'no-store', credentials: 'omit' });
          if (r.ok) { html = await r.text(); break; }
        } catch (e) {}
      }
      if (!html) throw new Error('Could not load app shell');
      html = html.replace(/https:\/\/cdn\.jsdelivr\.net\/gh\/Lizer-WebCoder\/divine-rays-tech-hub@[a-f0-9]+\/js\/admin-portal-lock\.js/gi,
        CDN + ADMIN_LOCK_SHA + '/js/admin-portal-lock.js');
      html = html.replace(/@main\/js\/admin-portal-lock\.js/g, '@' + ADMIN_LOCK_SHA + '/js/admin-portal-lock.js');
      if (html.indexOf('sidebar-profile-layout.js') === -1) {
        html = html.replace('</head>',
          '<script src="' + withBust(CDN + SIDEBAR_PROFILE_SHA + '/js/sidebar-profile-layout.js') + '"><\/script></head>');
      }
      document.open(); document.write(html); document.close(); clearTimeout(bootTimer);
      try {
        document.body.classList.add('dr-session-restoring', 'dr-boot-holding');
        setTimeout(function () {
          loadScript(CDN + FILTERS_SHA + '/js/filters.js');
          loadScript(CDN + PRIORITY_P1_SHA + '/js/priority-p1-display.js');
          loadScript(CDN + SIDEBAR_PROFILE_SHA + '/js/sidebar-profile-layout.js');
          loadScript(CDN + ADMIN_LOCK_SHA + '/js/admin-portal-lock.js');
          loadScript(CDN + 'a9046e485443b24e800a4f4d10747c10146ca663' + '/js/heartbeat-draw.js');
          loadScript(CDN + '90094058c1f476b163296855e186984add6a625d' + '/js/bg-anim-pin.js');
          loadScript(CDN + 'cf85fe34e66bb092edf09e521e0ef0879071354a' + '/js/sidebar-role-label.js');
        }, 50);
      } catch (e2) {}
      setTimeout(function () {
        try {
          document.body.classList.remove('dr-session-restoring', 'dr-boot-holding');
          if (window.__DR_DISMISS_BOOT) window.__DR_DISMISS_BOOT();
          var boot = document.getElementById('boot');
          if (boot) boot.remove();
        } catch (e3) {}
      }, 2500);
    } catch (err) {
      clearTimeout(bootTimer);
      var hint = document.getElementById('boot-hint');
      if (hint) hint.textContent = String(err && err.message || err);
      document.getElementById('boot').innerHTML = '<p style="color:#fca5a5">Could not load app. <button onclick="location.reload()">Retry</button></p>';
    }
  })();
  </script>
