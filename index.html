<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <title>Divine Rays Tech Hub — Support</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg?v=9.9.22-av-cards" />
  <style>
    html,body{margin:0;min-height:100vh;font-family:Inter,system-ui,sans-serif;background:radial-gradient(ellipse 80% 60% at 50% 40%,#1a1530 0%,#0c0c14 55%,#08080f 100%);color:#eeeef6}
    #boot{display:flex;align-items:center;justify-content:center;min-height:100vh;flex-direction:column;gap:1.25rem;text-align:center;padding:1.5rem}
    #boot .boot-logo{width:72px;height:72px;border-radius:16px;box-shadow:0 8px 32px rgba(109,90,154,.35);animation:drBootGearSpin 1.4s linear infinite;transform-origin:center center}
    #boot .boot-title{font-size:1.35rem;font-weight:650;margin:0;color:#eeeef6}
    #boot .boot-sub{font-size:.85rem;color:#9494ae;margin:0}
    #boot .err{color:#fca5a5;font-size:.9rem;max-width:28rem}
    @keyframes drBootGearSpin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <div id="boot" role="status" aria-live="polite">
    <img class="boot-logo" src="favicon.svg?v=9.9.9-boot" alt="Divine Rays" width="72" height="72" />
    <h1 class="boot-title">Divine Rays Tech Hub</h1>
    <p class="boot-sub">Loading…</p>
  </div>
  <script>
  (async function () {
    var B = Date.now();
    var HB = '80f8a73413ed5698b24c61856ddc5a1569714ac0';
    var BG_PIN = 'dd941697b969c4e269c2d1f17b68455d879ba080';
    var FADE = '449a55bb47f7e66cb45d4f616119a91bec3dd33d';
    var LOGIN_TAB = '75e92e768f6e5eba04b7090709953d7885f6fd14';
    var AGENT_AUTH = '761f65a9a4148efcabd6a78afb7e13f144943fa6';
    var OLD_AGENT_AUTH = '352793740bb2621d2d132e892827df83a58803f5';
    var LABEL_LOCK = '9de1260ef28bff8b7a0d8009d7ed4c38e904e272';
    var LOGIN_SRC = 'https://cdn.jsdelivr.net/gh/Lizer-WebCoder/divine-rays-tech-hub@' + LOGIN_TAB + '/js/login-tab-labels.js';
    var AGENT_SRC = 'https://cdn.jsdelivr.net/gh/Lizer-WebCoder/divine-rays-tech-hub@' + AGENT_AUTH + '/js/agent-username-auth.js';
    var LOCK_SRC = 'https://cdn.jsdelivr.net/gh/Lizer-WebCoder/divine-rays-tech-hub@' + LABEL_LOCK + '/js/login-label-lock.js';
    var AMBIENT_NO_RESET = '771607f8ff1bc501b305c8aa75be23628f58c058';
    var AMBIENT_STABLE = '4aec2854b1cfcf968600c3466b579a83c215547f';
    var NO_RESET_SRC = 'https://cdn.jsdelivr.net/gh/Lizer-WebCoder/divine-rays-tech-hub@' + AMBIENT_NO_RESET + '/js/ambient-no-reset.js';
    var STABLE_SRC = 'https://cdn.jsdelivr.net/gh/Lizer-WebCoder/divine-rays-tech-hub@' + AMBIENT_STABLE + '/js/ambient-stable.js';
    var HARD_LOCK = 'f4e7f568ebc07db459b5e6e6344486d6a7103c64';
    var HARD_LOCK_SRC = 'https://cdn.jsdelivr.net/gh/Lizer-WebCoder/divine-rays-tech-hub@' + HARD_LOCK + '/js/ambient-hard-lock.js';
    var FORCE_PENDING = '90b8cc49d229bea4e22dfa64e7366f690141d887';
    var FORCE_PENDING_SRC = 'https://cdn.jsdelivr.net/gh/Lizer-WebCoder/divine-rays-tech-hub@' + FORCE_PENDING + '/js/force-pending-block.js';
    var LOGIN_CLICK = 'b4a7d3b9eba51f165408aad269627da08f6e535b';
    var LOGIN_CLICK_SRC = 'https://cdn.jsdelivr.net/gh/Lizer-WebCoder/divine-rays-tech-hub@' + LOGIN_CLICK + '/js/login-click-fix.js';
    var ADMIN_JS = 'c54201aa340f2f53d81f10aa0bb07680811f58c4';
    var APP_JS = '5e1107f239eb33e0c397f62839334c57b1d56edb';
    var PORTAL_BOOT = 'e933bee7ba89c2c0d7a6eec91ec541146143f42f';
    var PORTAL_BOOT_SRC = 'https://cdn.jsdelivr.net/gh/Lizer-WebCoder/divine-rays-tech-hub@' + PORTAL_BOOT + '/js/portal-boot-login.js';
    var BLOCKED_HB = ['a9046e485443b24e800a4f4d10747c10146ca663','1887c6e9fe2436bf5402f2c4fa40dda29597416f','89e270ee25cc2e779e36e9c3011ddd21da3724c3','0f5ae49d8c798d58d91acf840190dab5cf059408','3bc50d042182f34d7c05eb077927231267170e5a'];
    var BLOCKED_BG = ['90094058c1f476b163296855e186984add6a625d','29ecd577333c6bd3b558c66a02c2fb32da4e01ca','e7eb85d8670580a5579f8fa2f6d3638ca4aa5265'];
    var urls = [
      'https://raw.githubusercontent.com/Lizer-WebCoder/divine-rays-tech-hub/2aa22823e014414ef2bad79bceae69b792cb56c0/index.html?b=' + B,
      'https://cdn.jsdelivr.net/gh/Lizer-WebCoder/divine-rays-tech-hub@2aa22823e014414ef2bad79bceae69b792cb56c0/index.html?b=' + B
    ];
    var html = null, lastErr = '';
    for (var i = 0; i < urls.length; i++) {
      try {
        var r = await fetch(urls[i], { cache: 'no-store', credentials: 'omit' });
        if (r.ok) { html = await r.text(); if (html && html.indexOf('SHELL_SHA') !== -1) break; html = null; }
        else lastErr = 'HTTP ' + r.status;
      } catch (e) { lastErr = String(e && e.message || e); }
    }
    if (!html) {
      var bootEl = document.getElementById('boot');
      if (bootEl) bootEl.innerHTML = '<p class="err">Could not load app shell (' + lastErr + '). Try again.</p>';
      return;
    }
    html = html.replace(/@main\/js\/admin-portal-lock\.js/g, '@38ee37552bd3fa8d80bfcea3677987b3bdb044fb/js/admin-portal-lock.js');
    html = html.replace(/[a-f0-9]{40}\/js\/force-pending-block\.js/g, FORCE_PENDING + '/js/force-pending-block.js');
    html = html.replace(/FORCE_PENDING_SHA\s*=\s*'[^']+'/g, "FORCE_PENDING_SHA = '" + FORCE_PENDING + "'");
    html = html.replace(/[a-f0-9]{40}\/js\/admin\.js/g, ADMIN_JS + '/js/admin.js');
    html = html.replace(/[a-f0-9]{40}\/js\/app\.js/g, APP_JS + '/js/app.js');
    html = html.replace(/[a-f0-9]{40}\/js\/sidebar-role-label\.js/g, 'bb96f36c73f4d2f33bd3e0e63774f2f9b4975c48/js/sidebar-role-label.js');
    for (var bi = 0; bi < BLOCKED_HB.length; bi++) {
      while (html.indexOf(BLOCKED_HB[bi]) !== -1) html = html.split(BLOCKED_HB[bi]).join(HB);
    }
    html = html.replace(/[a-f0-9]{40}\/js\/heartbeat-draw\.js/g, HB + '/js/heartbeat-draw.js');
    for (var bj = 0; bj < BLOCKED_BG.length; bj++) {
      while (html.indexOf(BLOCKED_BG[bj]) !== -1) html = html.split(BLOCKED_BG[bj]).join(BG_PIN);
    }
    html = html.replace(/[a-f0-9]{40}\/js\/bg-anim-pin\.js/g, BG_PIN + '/js/bg-anim-pin.js');
    var FORCE_LIGHT = '0091e77d27bbb73e655a498ddd1ebf944583e000';
    while (html.indexOf('ebcbb4637a65511602a399006a8ccc29f346ecfa') !== -1) html = html.split('ebcbb4637a65511602a399006a8ccc29f346ecfa').join(FORCE_LIGHT);
    html = html.replace(/[a-f0-9]{40}\/js\/force-light-bg\.js/g, FORCE_LIGHT + '/js/force-light-bg.js');
    while (html.indexOf(OLD_AGENT_AUTH) !== -1) html = html.split(OLD_AGENT_AUTH).join(AGENT_AUTH);
    html = html.replace(/[a-f0-9]{40}\/js\/agent-username-auth\.js/g, AGENT_AUTH + '/js/agent-username-auth.js');
    html = html.replace(/[a-f0-9]{40}\/js\/login-tab-labels\.js/g, LOGIN_TAB + '/js/login-tab-labels.js');
    html = html.replace(
      '<head>',
      '<head><script src="https://cdn.jsdelivr.net/gh/Lizer-WebCoder/divine-rays-tech-hub@' + FADE + '/js/boot-fade-sync.js"><\/script>' +
      '<script src="' + LOGIN_SRC + '"><\/script><script src="' + LOCK_SRC + '"><\/script>' +
      '<script src="' + FORCE_PENDING_SRC + '"><\/script><script src="' + LOGIN_CLICK_SRC + '"><\/script>'
    );
    var BOOT_CSS = '#boot .boot-logo,#dr-boot-overlay .boot-logo{width:72px;height:72px;border-radius:16px;animation:drBootGearSpin 1.4s linear infinite!important;transform-origin:center center!important;box-shadow:0 8px 32px rgba(109,90,154,.35)}#boot .boot-loader,#boot .boot-bar,#dr-boot-overlay .boot-loader{display:none!important}@keyframes drBootGearSpin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}';
    html = html.replace('</head>', '<style id="dr-boot-unified">' + BOOT_CSS + '</style></head>');
    document.open();
    document.write(html);
    document.close();

    /* IMMEDIATE first-click: works before CDN scripts load */
    (function () {
      if (window.__DR_EARLY_LOGIN) return;
      window.__DR_EARLY_LOGIN = 1;
      function agentForm() {
        return document.getElementById('login-agent') || document.querySelector('#login-screen form.login-form.active');
      }
      function findBtn(t) {
        if (!t || !t.closest) return null;
        var f = agentForm();
        if (!f) return null;
        var b = t.closest('button, input[type="submit"]');
        if (!b) return null;
        if (f.contains(b)) return b;
        var card = f.closest('.login-card, #login-screen');
        return (card && card.contains(b)) ? b : null;
      }
      function tryLogin(btn) {
        if (window.__drAgentLoginBusy || window.__drBooting) return;
        try {
          if (window.DRForcePending && window.DRForcePending.isPendingIdentity && window.DRForcePending.isPendingIdentity()) return;
        } catch (e) {}
        try {
          if (btn) {
            btn.setAttribute('data-dr-prev-label', btn.textContent || 'Sign in as Admin');
            btn.textContent = 'Signing in…';
            btn.disabled = true;
            btn.style.opacity = '0.85';
          }
        } catch (e2) {}
        if (typeof window.__drDoAgentLogin === 'function') {
          window.__drDoAgentLogin(btn || null);
          return;
        }
        window.__drEarlyLoginQueued = btn || true;
        var n = 0;
        var t = setInterval(function () {
          n++;
          if (typeof window.__drDoAgentLogin === 'function') {
            clearInterval(t);
            var b = window.__drEarlyLoginQueued === true ? null : window.__drEarlyLoginQueued;
            window.__drEarlyLoginQueued = null;
            window.__drDoAgentLogin(b);
          } else if (n > 50) {
            clearInterval(t);
            try {
              var form = agentForm();
              if (form) form.dispatchEvent(new Event('submit', { bubbles: true, cancelable: true }));
            } catch (e3) {}
          }
        }, 100);
      }
      document.addEventListener('pointerdown', function (ev) {
        if (ev.button != null && ev.button !== 0) return;
        var btn = findBtn(ev.target);
        if (!btn) return;
        tryLogin(btn);
      }, true);
    })();

    function inject(src) {
      try {
        var s = document.createElement('script');
        s.src = src + (src.indexOf('?') === -1 ? '?' : '&') + 'b=' + Date.now();
        s.async = false;
        (document.head || document.documentElement).appendChild(s);
      } catch (e) {}
    }
    function postBoot() {
      inject(LOGIN_SRC);
      inject(LOCK_SRC);
      inject(AGENT_SRC);
      inject(FORCE_PENDING_SRC);
      inject(LOGIN_CLICK_SRC);
      inject(PORTAL_BOOT_SRC);
      inject(NO_RESET_SRC);
      inject(STABLE_SRC);
      inject(HARD_LOCK_SRC);
    }
    setTimeout(postBoot, 50);
    setTimeout(postBoot, 400);
    setTimeout(postBoot, 1200);
    setTimeout(postBoot, 2500);
  })();
  </script>
</body>
</html>
