<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Divine Rays Tech Hub — Support</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg?v=8.0.3" />
  <style>
    html,body{margin:0;background:#0c0c12;color:#eeeef6;font-family:Inter,system-ui,sans-serif;min-height:100vh}
    #boot{display:flex;align-items:center;justify-content:center;min-height:100vh;font-size:0.95rem;color:#9494ae}
  </style>
  <script>(function(){try{var t=localStorage.getItem('dr_theme')||'dark';document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
</head>
<body>
  <div id="boot">Loading Divine Rays Tech Hub…</div>
  <script>
  (async function () {
    var PIN = '830dac02096eb08be1b2dc22bdc191a14df91a04';
    var urls = [
      'https://cdn.jsdelivr.net/gh/Lizer-WebCoder/divine-rays-tech-hub@' + PIN + '/index.html',
      'https://raw.githubusercontent.com/Lizer-WebCoder/divine-rays-tech-hub/' + PIN + '/index.html'
    ];
    var ver = '8.0.3';

    function loadScript(src) {
      return new Promise(function (resolve) {
        var s = document.createElement('script');
        s.src = src;
        s.async = false;
        s.onload = function () { resolve(src); };
        s.onerror = function () { console.warn('script fail', src); resolve(src); };
        document.body.appendChild(s);
      });
    }
    function loadCss(href) {
      var l = document.createElement('link');
      l.rel = 'stylesheet';
      l.href = href;
      document.head.appendChild(l);
    }
    function switchLoginTab(tab) {
      tab = tab === 'agent' ? 'agent' : 'customer';
      document.querySelectorAll('.ltab').forEach(function (b) {
        b.classList.toggle('active', b.getAttribute('data-ltab') === tab);
      });
      document.querySelectorAll('form.login-form').forEach(function (f) {
        f.classList.remove('active');
      });
      var f = document.getElementById(tab === 'agent' ? 'login-agent' : 'login-customer');
      if (f) f.classList.add('active');
    }
    function showForm(id) {
      document.querySelectorAll('form.login-form').forEach(function (f) { f.classList.remove('active'); });
      var f = document.getElementById(id);
      if (f) f.classList.add('active');
      var tab = (id || '').indexOf('agent') !== -1 ? 'agent' : 'customer';
      document.querySelectorAll('.ltab').forEach(function (b) {
        b.classList.toggle('active', b.getAttribute('data-ltab') === tab);
      });
    }
    window.switchLoginTab = switchLoginTab;
    window.showForm = showForm;

    function wireTabs() {
      document.querySelectorAll('.ltab').forEach(function (btn) {
        btn.onclick = function (e) {
          e.preventDefault();
          switchLoginTab(btn.getAttribute('data-ltab'));
        };
      });
    }

    try {
      var html = null;
      for (var i = 0; i < urls.length; i++) {
        try {
          var r = await fetch(urls[i] + (urls[i].indexOf('?') === -1 ? '?t=' : '&t=') + Date.now());
          if (r.ok) { html = await r.text(); break; }
        } catch (e) {}
      }
      if (!html) throw new Error('Could not load app shell');

      var parser = new DOMParser();
      var doc = parser.parseFromString(html, 'text/html');

      doc.querySelectorAll('link[rel="stylesheet"]').forEach(function (link) {
        var href = link.getAttribute('href') || '';
        if (!href) return;
        href = href.replace(/\?v=[^&"]+/g, '?v=' + ver);
        if (href.indexOf('http') !== 0 && href.indexOf('//') !== 0) {
          href = 'https://cdn.jsdelivr.net/gh/Lizer-WebCoder/divine-rays-tech-hub@' + PIN + '/' + href.replace(/^\.\//, '');
        }
        loadCss(href);
      });

      doc.querySelectorAll('head style').forEach(function (st) {
        var n = document.createElement('style');
        n.textContent = st.textContent;
        document.head.appendChild(n);
      });

      var bodyHtml = '';
      Array.prototype.forEach.call(doc.body.childNodes, function (node) {
        if (node.nodeName === 'SCRIPT') return;
        if (node.nodeType === 1) bodyHtml += node.outerHTML;
        else if (node.nodeType === 3) bodyHtml += node.textContent;
      });
      bodyHtml = bodyHtml.replace(/>v7\.[0-9.]+</g, '>v' + ver + '<').replace(/>v7\.[0-9.]+\s*</g, '>v' + ver + '<');
      bodyHtml = bodyHtml.replace(/v7\.6\.7/g, 'v' + ver);
      document.body.innerHTML = bodyHtml;
      document.querySelectorAll('.version').forEach(function (el) { el.textContent = 'v' + ver; });
      wireTabs();
      window.switchLoginTab = switchLoginTab;
      window.showForm = showForm;

      var scriptSrcs = [];
      doc.querySelectorAll('script[src]').forEach(function (sc) {
        var src = (sc.getAttribute('src') || '').replace(/\?v=[^&"]+/g, '?v=' + ver);
        if (src) {
          if (src.indexOf('http') !== 0 && src.indexOf('//') !== 0) {
            src = 'https://cdn.jsdelivr.net/gh/Lizer-WebCoder/divine-rays-tech-hub@' + PIN + '/' + src.replace(/^\.\//, '');
          }
          scriptSrcs.push(src);
        }
      });
      ['js/email-notify.js','js/ticket-plus.js','js/ticket-plus-fix.js','js/status-lock.js','js/csat.js','js/polish-fixes.js','js/saved-views.js'].forEach(function (base) {
        if (!scriptSrcs.some(function (s) { return s.indexOf(base) !== -1; })) {
          scriptSrcs.push('https://cdn.jsdelivr.net/gh/Lizer-WebCoder/divine-rays-tech-hub@' + PIN + '/' + base + '?v=' + ver);
        }
      });
      for (var j = 0; j < scriptSrcs.length; j++) await loadScript(scriptSrcs[j]);

      var OVERLAY_SHA = 'a2897de681305e165f83f8da20bf3aafa201008e';
      var JS_SHA = '8c7414ba0de46bb365414df630f20f6e6481369c';
      loadCss('https://cdn.jsdelivr.net/gh/Lizer-WebCoder/divine-rays-tech-hub@' + OVERLAY_SHA + '/css/v8-overlay.css?v=' + ver);
      await loadScript('https://cdn.jsdelivr.net/gh/Lizer-WebCoder/divine-rays-tech-hub@' + JS_SHA + '/js/theme.js?v=' + ver);
      await loadScript('https://cdn.jsdelivr.net/gh/Lizer-WebCoder/divine-rays-tech-hub@' + JS_SHA + '/js/filters.js?v=' + ver);
      var STATUS_SHA = '1e6520dca83cccafdc0f0d7d031f3bf6cde80c82';
      await loadScript('https://cdn.jsdelivr.net/gh/Lizer-WebCoder/divine-rays-tech-hub@' + STATUS_SHA + '/js/status-card.js?v=' + ver);
      var PRESENCE_SHA = '33d0b96f378a917410d1e96fcc714b15cd4e71e5';
      await loadScript('https://cdn.jsdelivr.net/gh/Lizer-WebCoder/divine-rays-tech-hub@' + PRESENCE_SHA + '/js/staff-presence.js?v=' + ver);
      var AVATAR_SHA = '7671a3fa3bdb1e3a3ab9e6a79a124661a0bdbf9e';
      await loadScript('https://cdn.jsdelivr.net/gh/Lizer-WebCoder/divine-rays-tech-hub@' + AVATAR_SHA + '/js/avatar-fix.js?v=' + ver);
      setTimeout(function () {
        if (!window.DRTheme) loadScript('https://raw.githubusercontent.com/Lizer-WebCoder/divine-rays-tech-hub/' + JS_SHA + '/js/theme.js?v=' + ver);
        if (!window.DRClearFilters) loadScript('https://raw.githubusercontent.com/Lizer-WebCoder/divine-rays-tech-hub/' + JS_SHA + '/js/filters.js?v=' + ver);
        if (!window.DRStatusCard) loadScript('https://raw.githubusercontent.com/Lizer-WebCoder/divine-rays-tech-hub/' + STATUS_SHA + '/js/status-card.js?v=' + ver);
        if (!window.DRStaffPresence) loadScript('https://raw.githubusercontent.com/Lizer-WebCoder/divine-rays-tech-hub/' + PRESENCE_SHA + '/js/staff-presence.js?v=' + ver);
        if (!window.DRAvatarFix) loadScript('https://raw.githubusercontent.com/Lizer-WebCoder/divine-rays-tech-hub/' + AVATAR_SHA + '/js/avatar-fix.js?v=' + ver);
      }, 600);

      function applyV8Once() {
        document.querySelectorAll('.version').forEach(function (el) {
          if (el.textContent.indexOf('8.0.3') === -1) el.textContent = 'v' + ver;
        });
        var info = document.querySelector('.mode-bar .user-info') || document.querySelector('.user-info');
        if (info && !document.getElementById('btn-theme')) {
          var b = document.createElement('button');
          b.type = 'button';
          b.id = 'btn-theme';
          b.className = 'btn btn-ghost btn-sm btn-theme';
          var cur0 = document.documentElement.getAttribute('data-theme') || 'dark';
          try { cur0 = localStorage.getItem('dr_theme') || cur0; } catch (e) {}
          document.documentElement.setAttribute('data-theme', cur0);
          b.textContent = cur0 === 'light' ? 'Dark' : 'Light';
          b.addEventListener('click', function () {
            var cur = document.documentElement.getAttribute('data-theme') || 'dark';
            var next = cur === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', next);
            try { localStorage.setItem('dr_theme', next); } catch (e) {}
            b.textContent = next === 'light' ? 'Dark' : 'Light';
          });
          info.insertBefore(b, info.firstChild);
        }
        if (window.DRTheme && window.DRTheme.ensure) {
          try { window.DRTheme.ensure(); } catch (e) {}
        }
        if (window.DRStatusCard && window.DRStatusCard.refresh) {
          try { window.DRStatusCard.refresh(); } catch (e) {}
        }
        if (window.DRStaffPresence && window.DRStaffPresence.refresh) {
          try { window.DRStaffPresence.refresh(); } catch (e) {}
        }
        if (window.DRAvatarFix && window.DRAvatarFix.sync) {
          try { window.DRAvatarFix.sync(); } catch (e) {}
        }
      }
      applyV8Once();
      setTimeout(applyV8Once, 500);
      setTimeout(applyV8Once, 2000);
      setTimeout(applyV8Once, 5000);

      window.switchLoginTab = switchLoginTab;
      window.showForm = showForm;
      wireTabs();
    } catch (err) {
      console.error(err);
      if (document.getElementById('boot')) document.getElementById('boot').textContent = 'Load error: ' + (err.message || err);
    }
  })();
  </script>
</body>
</html>
