<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Divine Rays Tech Hub — Support Tickets</title>
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="app">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="brand">
        <div class="logo">✦</div>
        <div>
          <h1>Divine Rays</h1>
          <p>Tech Hub</p>
        </div>
      </div>

      <nav class="nav">
        <button class="nav-btn active" data-view="dashboard">
          <span>Dashboard</span>
        </button>
        <button class="nav-btn" data-view="new-ticket">
          <span>New Ticket</span>
        </button>
        <button class="nav-btn" data-view="all-tickets">
          <span>All Tickets</span>
        </button>
      </nav>

      <div class="sidebar-footer">
        <p class="version">v1.0 · Local Storage</p>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main">
      <header class="topbar">
        <h2 id="page-title">Dashboard</h2>
        <div class="topbar-actions">
          <input type="search" id="search-input" placeholder="Search tickets..." />
          <button id="btn-new-ticket" class="btn btn-primary">+ New Ticket</button>
        </div>
      </header>

      <!-- Dashboard View -->
      <section id="view-dashboard" class="view active">
        <div class="stats">
          <div class="stat-card">
            <span class="stat-label">Open</span>
            <span class="stat-value" id="stat-open">0</span>
          </div>
          <div class="stat-card">
            <span class="stat-label">In Progress</span>
            <span class="stat-value" id="stat-progress">0</span>
          </div>
          <div class="stat-card">
            <span class="stat-label">Waiting</span>
            <span class="stat-value" id="stat-waiting">0</span>
          </div>
          <div class="stat-card">
            <span class="stat-label">Resolved</span>
            <span class="stat-value" id="stat-resolved">0</span>
          </div>
        </div>

        <div class="section-header">
          <h3>Recent Tickets</h3>
          <select id="filter-status">
            <option value="">All Statuses</option>
            <option value="Open">Open</option>
            <option value="In Progress">In Progress</option>
            <option value="Waiting">Waiting</option>
            <option value="Resolved">Resolved</option>
            <option value="Closed">Closed</option>
          </select>
        </div>

        <div id="ticket-list" class="ticket-list"></div>
      </section>

      <!-- New Ticket View -->
      <section id="view-new-ticket" class="view">
        <form id="ticket-form" class="ticket-form">
          <div class="form-group">
            <label for="ticket-title">Title *</label>
            <input type="text" id="ticket-title" required placeholder="Brief summary of the issue" />
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="ticket-priority">Priority</label>
              <select id="ticket-priority">
                <option value="Low">Low</option>
                <option value="Medium" selected>Medium</option>
                <option value="High">High</option>
                <option value="Critical">Critical</option>
              </select>
            </div>
            <div class="form-group">
              <label for="ticket-category">Category</label>
              <select id="ticket-category">
                <option value="Hardware">Hardware</option>
                <option value="Software">Software</option>
                <option value="Network">Network</option>
                <option value="Account">Account / Access</option>
                <option value="Other">Other</option>
              </select>
            </div>
          </div>

          <div class="form-group">
            <label for="ticket-requester">Requester Name *</label>
            <input type="text" id="ticket-requester" required placeholder="Who is reporting this?" />
          </div>

          <div class="form-group">
            <label for="ticket-email">Requester Email</label>
            <input type="email" id="ticket-email" placeholder="optional@email.com" />
          </div>

          <div class="form-group">
            <label for="ticket-description">Description *</label>
            <textarea id="ticket-description" rows="6" required placeholder="Describe the issue in detail..."></textarea>
          </div>

          <div class="form-actions">
            <button type="button" class="btn btn-secondary" id="btn-cancel">Cancel</button>
            <button type="submit" class="btn btn-primary">Create Ticket</button>
          </div>
        </form>
      </section>

      <!-- Ticket Detail View -->
      <section id="view-detail" class="view">
        <button class="btn btn-ghost" id="btn-back">← Back to list</button>

        <article class="ticket-detail" id="ticket-detail">
          <!-- Filled by JS -->
        </article>

        <div class="comments-section">
          <h3>Activity & Comments</h3>
          <div id="comments-list" class="comments-list"></div>

          <form id="comment-form" class="comment-form">
            <textarea id="comment-text" rows="3" placeholder="Add a comment or update..."></textarea>
            <div class="form-actions">
              <select id="comment-status">
                <option value="">Keep current status</option>
                <option value="Open">Set to Open</option>
                <option value="In Progress">Set to In Progress</option>
                <option value="Waiting">Set to Waiting</option>
                <option value="Resolved">Set to Resolved</option>
                <option value="Closed">Set to Closed</option>
              </select>
              <button type="submit" class="btn btn-primary">Add Update</button>
            </div>
          </form>
        </div>
      </section>
    </main>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
