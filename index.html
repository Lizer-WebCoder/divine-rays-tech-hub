<!DOCTYPE html>
<html lang="en" data-ecg="on" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <title>Divine Rays Tech Hub — Support</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg?v=948" />
  <script>
    window.__DR_ECG_OK = true;
    try {
      document.documentElement.setAttribute('data-ecg', 'on');
      document.documentElement.setAttribute('data-theme', 'dark');
      localStorage.setItem('dr_theme', 'dark');
    } catch (e) {}
  </script>
  <style>
    html,body{
      margin:0;min-height:100vh;color:#eeeef6;
      font-family:Inter,system-ui,-apple-system,sans-serif;
      background:radial-gradient(ellipse 80% 60% at 50% 40%,#1a1530 0%,#0c0c14 55%,#08080f 100%)!important;
      background-attachment:fixed!important
    }
    #login-screen,.login-screen{
      background:transparent!important;
      background-image:none!important;
      background-color:transparent!important
    }
    /* Kill Light button BEFORE it can paint (login-theme creates #dr-login-theme) */
    #dr-login-theme,
    #btn-theme,
    [data-theme-toggle],
    #theme-toggle,
    .theme-fab{
      display:none!important;
      visibility:hidden!important;
      opacity:0!important;
      pointer-events:none!important;
      width:0!important;height:0!important;
      overflow:hidden!important;
      position:absolute!important;left:-9999px!important
    }
    #boot{
      display:flex;align-items:center;justify-content:center;min-height:100vh;
      flex-direction:column;gap:.85rem;position:relative;z-index:9999;
      background:radial-gradient(ellipse 80% 60% at 50% 40%,#1a1530 0%,#0c0c14 55%,#08080f 100%)
    }
    #boot .boot-gear{
      width:52px;height:52px;border-radius:14px;
      background:linear-gradient(135deg,#7c6af0,#a78bfa);
      display:grid;place-items:center;
      animation:bootSpin 2.2s linear infinite;
      box-shadow:0 0 24px rgba(124,106,240,.45)
    }
    #boot .boot-gear svg{width:28px;height:28px;fill:#fff}
    #boot p{margin:0;color:#9494ae;font-size:.95rem}
    #boot .boot-bar{width:120px;height:3px;border-radius:2px;overflow:hidden;background:rgba(167,139,250,.15)}
    #boot .boot-bar-fill{
      height:100%;width:40%;border-radius:2px;
      background:linear-gradient(90deg,#8b7cf0,#c4b5fd,#8b7cf0);background-size:200% 100%;
      animation:bootBar 1.4s ease-in-out infinite
    }
    @keyframes bootSpin{to{transform:rotate(360deg)}}
    @keyframes bootBar{
      0%{transform:translateX(-100%)}100%{transform:translateX(280%)}
    }
    #dr-lifeline{
      display:block!important;visibility:visible!important;opacity:1!important;
      pointer-events:none!important;
      position:fixed!important;inset:0!important;
      width:100%!important;height:100%!important;
      z-index:0!important
    }
    #dr-lifeline .dr-ecg-glow{
      stroke-width:3.6px!important;
      filter:drop-shadow(0 0 5px rgba(233,213,255,.9)) drop-shadow(0 0 12px rgba(167,139,250,.55))!important
    }
    #dr-lifeline .dr-ecg-core{
      stroke-width:2.4px!important;
      filter:drop-shadow(0 0 2px rgba(243,232,255,.55))!important
    }
  </style>
</head>
<body>
  <div id="boot">
    <div class="boot-gear" aria-hidden="true">
      <svg viewBox="0 0 64 64"><g transform="translate(32,32)"><rect x="-3.2" y="-26" width="6.4" height="10" rx="1.2"/><rect x="-3.2" y="-26" width="6.4" height="10" rx="1.2" transform="rotate(45)"/><rect x="-3.2" y="-26" width="6.4" height="10" rx="1.2" transform="rotate(90)"/><rect x="-3.2" y="-26" width="6.4" height="10" rx="1.2" transform="rotate(135)"/><rect x="-3.2" y="-26" width="6.4" height="10" rx="1.2" transform="rotate(180)"/><rect x="-3.2" y="-26" width="6.4" height="10" rx="1.2" transform="rotate(225)"/><rect x="-3.2" y="-26" width="6.4" height="10" rx="1.2" transform="rotate(270)"/><rect x="-3.2" y="-26" width="6.4" height="10" rx="1.2" transform="rotate(315)"/><circle r="17"/><circle r="9" fill="#1a1625"/><circle r="5"/></g></svg>
    </div>
    <p>Loading Divine Rays Tech Hub…</p>
    <div class="boot-bar"><div class="boot-bar-fill"></div></div>
  </div>
  <script>
  (async function () {
    var PIN = '830dac02096eb08be1b2dc22bdc191a14df91a04';
    var CDN = 'https://cdn.jsdelivr.net/gh/Lizer-WebCoder/divine-rays-tech-hub@';
    var B = Date.now();

    function loadSync(src) {
      return new Promise(function (res) {
        var s = document.createElement('script');
        s.src = src;
        s.async = false;
        s.onload = function () { res(); };
        s.onerror = function () { res(); };
        document.body.appendChild(s);
      });
    }

    function injectDefer(src) {
      var s = document.createElement('script');
      s.src = src;
      s.defer = true;
      document.body.appendChild(s);
    }

    function killLightBtn() {
      try {
        document.documentElement.setAttribute('data-theme', 'dark');
        localStorage.setItem('dr_theme', 'dark');
        var ids = ['dr-login-theme', 'btn-theme', 'theme-toggle'];
        ids.forEach(function (id) {
          var el = document.getElementById(id);
          if (el) el.remove();
        });
        document.querySelectorAll('[data-theme-toggle],.theme-fab').forEach(function (el) {
          el.remove();
        });
        /* stub login-theme toggle so it cannot recreate */
        if (window.ensureLoginToggle) window.ensureLoginToggle = function () {};
      } catch (e) {}
    }

    /* Catch Light button the instant login-theme injects it */
    try {
      var mo = new MutationObserver(function () { killLightBtn(); });
      mo.observe(document.documentElement, { childList: true, subtree: true });
      setTimeout(function () { try { mo.disconnect(); } catch (e) {} }, 8000);
    } catch (e0) {}

    try {
      var r = await fetch(CDN + PIN + '/index.html?b=' + B, { cache: 'no-store', credentials: 'omit' });
      if (!r.ok) r = await fetch('https://raw.githubusercontent.com/Lizer-WebCoder/divine-rays-tech-hub/' + PIN + '/index.html?b=' + B, { cache: 'no-store' });
      if (!r.ok) throw new Error('shell fetch failed');
      var html = await r.text();

      html = html
        .replace(/>Customer</g, '>Employee<')
        .replace(/>Tech Support</g, '>Admin<')
        .replace(/Create Customer Account/g, 'Create End-User Account')
        .replace(/Sign In as Agent/g, 'Sign In')
        .replace(/Create agent account/g, 'Create Admin account')
        .replace(/Lizzz?\s*[·•\-]\s*All Rights Reserved/gi, 'Boys at the Back LRK · All Rights Reserved');

      var doc = new DOMParser().parseFromString(html, 'text/html');

      doc.querySelectorAll('link[rel="stylesheet"], style').forEach(function (n) {
        if (n.tagName === 'LINK') {
          var href = n.getAttribute('href') || '';
          if (href && href.indexOf('http') !== 0)
            href = CDN + PIN + '/' + href.replace(/^\.\//, '').split('?')[0] + '?v=948';
          n.setAttribute('href', href);
          document.head.appendChild(document.importNode(n, true));
        } else {
          document.head.appendChild(document.importNode(n, true));
        }
      });

      var bodyHtml = '';
      Array.prototype.forEach.call(doc.body.childNodes, function (node) {
        if (node.nodeName === 'SCRIPT') return;
        if (node.nodeType === 1) bodyHtml += node.outerHTML;
        else if (node.nodeType === 3) bodyHtml += node.textContent;
      });
      document.body.innerHTML = bodyHtml;

      try {
        document.body.style.background =
          'radial-gradient(ellipse 80% 60% at 50% 40%,#1a1530 0%,#0c0c14 55%,#08080f 100%)';
        document.body.style.backgroundAttachment = 'fixed';
        document.body.classList.add('is-login');
      } catch (e1) {}

      window.__DR_ECG_OK = true;
      try {
        document.documentElement.setAttribute('data-ecg', 'on');
        document.documentElement.setAttribute('data-theme', 'dark');
        localStorage.setItem('dr_theme', 'dark');
      } catch (e2) {}
      killLightBtn();

      var core = [];
      doc.querySelectorAll('script[src]').forEach(function (sc) {
        var src = sc.getAttribute('src') || '';
        if (!src) return;
        if (src.indexOf('http') !== 0)
          src = CDN + PIN + '/' + src.replace(/^\.\//, '').split('?')[0] + '?v=948';
        core.push(src);
      });
      for (var c = 0; c < core.length; c++) await loadSync(core[c]);

      await loadSync(CDN + '90094058c1f476b163296855e186984add6a625d/js/bg-anim-pin.js?v=948');
      await loadSync(CDN + 'a9046e485443b24e800a4f4d10747c10146ca663/js/heartbeat-draw.js?v=948');

      window.__DR_ECG_OK = true;
      try {
        document.documentElement.setAttribute('data-ecg', 'on');
        if (window.DRBgAnimPin && window.DRBgAnimPin.refresh) window.DRBgAnimPin.refresh();
        if (window.DRHeartbeatDraw && window.DRHeartbeatDraw.refresh) window.DRHeartbeatDraw.refresh();
        if (window.DRHeartbeatDraw && window.DRHeartbeatDraw.start) window.DRHeartbeatDraw.start();
      } catch (e3) {}
      killLightBtn();

      /* login-theme for glass card only — Light btn killed by CSS + killLightBtn */
      await loadSync(CDN + '8c56504dc4ae1c397eb336de3d117dd3bd022ed7/js/login-theme.js?v=948');
      killLightBtn();
      try {
        if (window.ensureLoginToggle) window.ensureLoginToggle = function () {};
      } catch (e4) {}

      ['9beff1f92931/js/login-tab-labels.js',
       '233f36150987e8576aab9114d1ca329bf09fa6a0/js/login-nav-fix.js',
       '8afd47c0aa694ef7483f413d2ad7c15ea2be7b30/js/login-shell-sep.js'
      ].forEach(function (p) {
        var s = document.createElement('script');
        s.src = CDN + p + '?v=948';
        s.async = true;
        document.body.appendChild(s);
      });

      setTimeout(function () {
        [
          '9a17dcda7cbe5a9ad3f9af120b4135532b149a13/js/admin-portal-lock.js',
          '545afd29cbaede602653f78631d8c97ce7558683/js/sidebar-profile-layout.js',
          'cf85fe34e66bb092edf09e521e0ef0879071354a/js/sidebar-role-label.js',
          '39e8c69ab7c04cb4900cc40992419ecffb482735/js/supabase-400-fix.js',
          '51facff11f44ff41c897107bad8583c6f9d5f3bf/js/avatar-fix.js',
          'e65c070009674e02288c96a305daab5e0245e28e/js/filters.js',
          '5fa3d4a86e002268a75ed1068d1f96259ecb9344/js/priority-p1-display.js',
          'd987fd7a6e51a612230c882e1da3138486010593/js/ticket-stable.js',
          '895cb8b253e0fab3ad79e2d06fa06f30feded687/js/ticket-card-render.js',
          '4326d1ddf5e9a5628834aa36f87999d7e0a4b87a/js/ticket-card-css.js',
          '875b2f5b1c8293bb219943429c01020f28114d5b/js/ticket-list-fix.js',
          '7a09542332b8227930871a5a055162c570a3fdb7/js/csat-dashboard.js',
          '53aba5366d53c7fc6c8208ecb594eeeb10d46e2f/js/admin.js'
        ].forEach(function (p) { injectDefer(CDN + p + '?v=948'); });
      }, 2000);

      setTimeout(killLightBtn, 300);
      setTimeout(killLightBtn, 1000);
      setTimeout(function () {
        killLightBtn();
        window.__DR_ECG_OK = true;
        try {
          document.documentElement.setAttribute('data-ecg', 'on');
          document.body.style.background =
            'radial-gradient(ellipse 80% 60% at 50% 40%,#1a1530 0%,#0c0c14 55%,#08080f 100%)';
          if (window.DRBgAnimPin && window.DRBgAnimPin.refresh) window.DRBgAnimPin.refresh();
          if (window.DRHeartbeatDraw && window.DRHeartbeatDraw.refresh) window.DRHeartbeatDraw.refresh();
        } catch (e5) {}
      }, 800);
    } catch (err) {
      var boot = document.getElementById('boot');
      if (boot) boot.innerHTML = '<p style="color:#fca5a5">Could not load.</p><button onclick="location.reload()">Retry</button>';
    }
  })();
  </script>
</body>
</html>
