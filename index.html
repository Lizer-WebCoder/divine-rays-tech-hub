<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <title>Divine Rays Tech Hub - Support</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <style>
    html,body{margin:0;min-height:100vh;font-family:Inter,system-ui,sans-serif;
      background:radial-gradient(ellipse at 50% 40%,#1e1240 0%,#0c0618 70%);color:#eeeef6}
    #boot{display:flex;align-items:center;justify-content:center;min-height:100vh;flex-direction:column;gap:1.25rem;text-align:center;padding:1.5rem}
    .boot-title{font-size:1.35rem;font-weight:650;margin:0;color:#eeeef6}
    .boot-sub{font-size:.85rem;color:#9494ae;margin:0}
    .err{color:#fca5a5;font-size:.9rem;max-width:28rem}
    .boot-logo{width:72px;height:72px;border-radius:16px;display:block;box-shadow:0 8px 32px rgba(109,90,154,.35)}
    .boot-gear-spin{transform-origin:32px 32px;transform-box:view-box;animation:drBootGearSpin 1.4s linear infinite}
    @keyframes drBootGearSpin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <div id="boot">
    <svg class="boot-logo" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <rect width="64" height="64" rx="14" fill="#1a1230"/>
      <g class="boot-gear-spin">
        <path fill="#a78bfa" d="M32 12l2.4 6.5 6.8-1.2-1.2 6.8 6.5 2.4-4.5 5.3 4.5 5.3-6.5 2.4 1.2 6.8-6.8-1.2L32 52l-2.4-6.5-6.8 1.2 1.2-6.8-6.5-2.4 4.5-5.3-4.5-5.3 6.5-2.4-1.2-6.8 6.8 1.2z"/>
        <circle cx="32" cy="32" r="7" fill="#1a1230"/>
      </g>
    </svg>
    <p class="boot-title">Loading Divine Rays Tech Hub…</p>
    <p class="boot-sub">Restoring workspace</p>
  </div>
  <script>
  (function () {
    // Load the last known-good full bootloader (commit 9894858) — full overlay stack + shell
    var urls = [
      'https://cdn.jsdelivr.net/gh/Lizer-WebCoder/divine-rays-tech-hub@989485835a213c6312ee1dba740ff32259b506f0/index.html',
      'https://raw.githubusercontent.com/Lizer-WebCoder/divine-rays-tech-hub/989485835a213c6312ee1dba740ff32259b506f0/index.html'
    ];
    function fail(msg) {
      var b = document.getElementById('boot');
      if (b) b.innerHTML = '<p class="err">' + msg + '</p><p class="boot-sub">Hard refresh (Ctrl+Shift+R) and try again</p>';
    }
    function tryFetch(i) {
      if (i >= urls.length) { fail('Could not restore app'); return; }
      fetch(urls[i], { cache: 'no-store' }).then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.text();
      }).then(function (html) {
        if (!html || html.indexOf('OVERLAYS') === -1) throw new Error('bad bootloader');
        document.open();
        document.write(html);
        document.close();
      }).catch(function () {
        tryFetch(i + 1);
      });
    }
    tryFetch(0);
  })();
  </script>
</body>
</html>
