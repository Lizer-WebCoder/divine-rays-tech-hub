<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Divine Rays Tech Hub — Support</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg?v=8.0.3" />
  <style>
    html,body{margin:0;background:#0c0c12;color:#eeeef6;font-family:Inter,system-ui,sans-serif;min-height:100vh}
    #boot{display:flex;align-items:center;justify-content:center;min-height:100vh;font-size:0.95rem;color:#9494ae}
  </style>
</head>
<body>
  <div id="boot">Loading Divine Rays Tech Hub…</div>
  <script>
  (async function () {
    var BOOT = document.getElementById('boot');
    var PIN = '830dac02096eb08be1b2dc22bdc191a14df91a04';
    var urls = [
      'https://cdn.jsdelivr.net/gh/Lizer-WebCoder/divine-rays-tech-hub@' + PIN + '/index.html',
      'https://raw.githubusercontent.com/Lizer-WebCoder/divine-rays-tech-hub/' + PIN + '/index.html'
    ];
    var ver = '8.0.3';

    function loadScript(src) {
      return new Promise(function (resolve) {
        var s = document.createElement('script');
        s.src = src;
        s.async = false;
        s.onload = function () { resolve(src); };
        s.onerror = function () { console.warn('script fail', src); resolve(src); };
        document.body.appendChild(s);
      });
    }
    function loadCss(href) {
      var l = document.createElement('link');
      l.rel = 'stylesheet';
      l.href = href;
      document.head.appendChild(l);
    }
    function switchLoginTab(tab) {
      tab = tab === 'agent' ? 'agent' : 'customer';
      document.querySelectorAll('.ltab').forEach(function (b) {
        b.classList.toggle('active', b.getAttribute('data-ltab') === tab);
      });
      document.querySelectorAll('form.login-form').forEach(function (f) {
        f.classList.remove('active');
      });
      var f = document.getElementById(tab === 'agent' ? 'login-agent' : 'login-customer');
      if (f) f.classList.add('active');
    }
    function showForm(id) {
      document.querySelectorAll('form.login-form').forEach(function (f) { f.classList.remove('active'); });
      var f = document.getElementById(id);
      if (f) f.classList.add('active');
      var tab = (id || '').indexOf('agent') !== -1 ? 'agent' : 'customer';
      document.querySelectorAll('.ltab').forEach(function (b) {
        b.classList.toggle('active', b.getAttribute('data-ltab') === tab);
      });
    }
    window.switchLoginTab = switchLoginTab;
    window.showForm = showForm;

    function wireTabs() {
      document.querySelectorAll('.ltab').forEach(function (btn) {
        btn.onclick = function (e) {
          e.preventDefault();
          switchLoginTab(btn.getAttribute('data-ltab'));
        };
      });
      document.querySelectorAll('.login-switch a').forEach(function (a) {
        var href = a.getAttribute('href') || '';
        var m = href.match(/showForm\(['\"]([^'\"]+)['\"]\)/) || (a.getAttribute('onclick') || '').match(/showForm\(['\"]([^'\"]+)['\"]\)/);
        if (m) {
          a.onclick = function (e) {
            e.preventDefault();
            showForm(m[1]);
            return false;
          };
        }
      });
    }

    try {
      var html = null;
      for (var i = 0; i < urls.length; i++) {
        try {
          var r = await fetch(urls[i] + (urls[i].indexOf('?') === -1 ? '?t=' : '&t=') + Date.now());
          if (r.ok) { html = await r.text(); break; }
        } catch (e) {}
      }
      if (!html) throw new Error('Could not load app shell');

      var parser = new DOMParser();
      var doc = parser.parseFromString(html, 'text/html');

      doc.querySelectorAll('link[rel="stylesheet"]').forEach(function (link) {
        var href = link.getAttribute('href') || '';
        if (!href) return;
        href = href.replace(/\?v=[^&"]+/g, '?v=' + ver);
        if (href.indexOf('http') !== 0 && href.indexOf('//') !== 0) {
          href = 'https://cdn.jsdelivr.net/gh/Lizer-WebCoder/divine-rays-tech-hub@' + PIN + '/' + href.replace(/^\.\//, '');
        }
        loadCss(href);
      });

      doc.querySelectorAll('link[rel="icon"], link[rel="shortcut icon"]').forEach(function (link) {
        var href = link.getAttribute('href') || 'favicon.svg';
        var l = document.createElement('link');
        l.rel = 'icon';
        l.type = link.getAttribute('type') || 'image/svg+xml';
        l.href = href.indexOf('?') === -1 ? href + '?v=' + ver : href.replace(/\?v=[^&"]+/g, '?v=' + ver);
        document.head.appendChild(l);
      });
      if (!document.querySelector('link[rel="icon"]')) {
        var l2 = document.createElement('link');
        l2.rel = 'icon';
        l2.type = 'image/svg+xml';
        l2.href = 'favicon.svg?v=' + ver;
        document.head.appendChild(l2);
      }

      doc.querySelectorAll('head style').forEach(function (st) {
        var n = document.createElement('style');
        n.textContent = st.textContent;
        document.head.appendChild(n);
      });
      var bodyHtml = '';
      Array.prototype.forEach.call(doc.body.childNodes, function (node) {
        if (node.nodeName === 'SCRIPT') return;
        if (node.nodeType === 1) bodyHtml += node.outerHTML;
        else if (node.nodeType === 3) bodyHtml += node.textContent;
      });
      document.body.innerHTML = bodyHtml;
      wireTabs();
      window.switchLoginTab = switchLoginTab;
      window.showForm = showForm;

      var scriptSrcs = [];
      doc.querySelectorAll('script[src]').forEach(function (sc) {
        var src = (sc.getAttribute('src') || '').replace(/\?v=[^&"]+/g, '?v=' + ver);
        if (src) {
          if (src.indexOf('http') !== 0 && src.indexOf('//') !== 0) {
            src = 'https://cdn.jsdelivr.net/gh/Lizer-WebCoder/divine-rays-tech-hub@' + PIN + '/' + src.replace(/^\.\//, '');
          }
          scriptSrcs.push(src);
        }
      });
      ['js/email-notify.js','js/ticket-plus.js','js/ticket-plus-fix.js','js/status-lock.js','js/csat.js','js/polish-fixes.js','js/saved-views.js'].forEach(function (base) {
        if (!scriptSrcs.some(function (s) { return s.indexOf(base) !== -1; })) {
          scriptSrcs.push('https://cdn.jsdelivr.net/gh/Lizer-WebCoder/divine-rays-tech-hub@' + PIN + '/' + base + '?v=' + ver);
        }
      });
      for (var j = 0; j < scriptSrcs.length; j++) await loadScript(scriptSrcs[j]);

      // v8.0.3 overlay: light/dark + Clear + avatar spacing
      var MAIN = 'https://cdn.jsdelivr.net/gh/Lizer-WebCoder/divine-rays-tech-hub@main';
      loadCss(MAIN + '/css/v8-overlay.css?v=' + ver);
      await loadScript(MAIN + '/js/theme.js?v=' + ver);
      await loadScript(MAIN + '/js/filters.js?v=' + ver);
      document.querySelectorAll('.version').forEach(function (el) { el.textContent = 'v' + ver; });

      window.switchLoginTab = switchLoginTab;
      window.showForm = showForm;
      wireTabs();
      setInterval(function () {
        if (!window.switchLoginTab || String(window.switchLoginTab).indexOf('data-ltab') === -1) {
          window.switchLoginTab = switchLoginTab;
          window.showForm = showForm;
        }
      }, 1000);
    } catch (err) {
      console.error(err);
      if (document.getElementById('boot')) document.getElementById('boot').textContent = 'Load error: ' + (err.message || err);
    }
  })();
  </script>
</body>
</html>
